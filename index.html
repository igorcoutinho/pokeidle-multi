<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
<title>PokeIdle Multi</title>
<style>
  :root{--fundo:#1d1010;--barra:#3a2020;--borda:#e2915a;--texto:#f6e7d4;--roxo:#b04ad0;--ouro:#f3c77a}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--fundo);color:var(--texto);font:13px system-ui,sans-serif;overflow:hidden}
  #topo{height:38px;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--barra);border-bottom:2px solid var(--borda)}
  #topo b{color:var(--ouro);letter-spacing:.5px;margin-right:8px}
  #topo .esp{flex:1}
  #topo .info{opacity:.75;font-size:12px}
  button{background:#5a3232;border:1px solid #8a5a4a;color:var(--texto);border-radius:6px;padding:4px 9px;cursor:pointer;font:inherit}
  button:hover{background:#6e3d3d}
  button.prim{background:var(--roxo);border-color:var(--ouro);color:#fff}
  #grade{position:absolute;top:38px;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:4px;padding:4px}
  #grade.solo{grid-template-columns:1fr;grid-template-rows:1fr}
  #grade.solo .conta:not(.foco){display:none}
  #abas-1x1{display:none;gap:4px}#abas-1x1.on{display:flex}
  #abas-1x1 button.on{background:var(--roxo);border-color:var(--ouro);color:#fff}
  .conta{position:relative;display:flex;flex-direction:column;border:2px solid #5a3232;border-radius:8px;overflow:hidden;background:#000;min-width:0;min-height:0}
  .conta.foco{border-color:var(--borda)}
  .cab{height:28px;flex:none;display:flex;align-items:center;gap:6px;padding:0 6px;background:var(--barra)}
  .cab .num{background:var(--roxo);color:#fff;border-radius:5px;padding:1px 7px;font-weight:800}
  .cab input.nome{background:transparent;border:1px solid transparent;color:var(--texto);font:600 13px system-ui;width:140px;border-radius:5px;padding:2px 4px}
  .cab input.nome:hover,.cab input.nome:focus{border-color:#8a5a4a;outline:none;background:#2a1515}
  .cab .esp{flex:1}
  .cab .zoom{min-width:38px;text-align:center;opacity:.8;font-size:12px}
  .cab button{padding:1px 7px;font-size:12px}
  .cab button.eco.on{background:#2f6b3a;border-color:#7fdc8f}
  .cab .estado{width:9px;height:9px;border-radius:50%;background:#888}
  .cab .estado.ok{background:#6f6;box-shadow:0 0 5px #6f6}
  .cab .estado.carregando{background:#fc6}
  webview{flex:1;width:100%;min-height:0}
  #reb-fundo{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center}
  #reb-fundo.aberto{display:flex}
  #reb-modal{width:min(820px,95vw);max-height:90vh;overflow:auto;background:#3a2020;border:3px solid var(--borda);border-radius:14px;padding:0 0 12px}
  #reb-modal header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#c9754a;color:#2a1212;font-weight:800}
  #reb-modal section{padding:10px 14px;border-bottom:1px solid #5a3232}
  #reb-modal .linha{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
  #reb-modal select,#reb-modal input{background:#2a1515;border:1px solid #8a5a4a;color:var(--texto);border-radius:6px;padding:4px 8px;font:inherit}
  #reb-modal input{width:64px}
  #reb-modal table{width:100%;border-collapse:collapse;font-size:12px}
  #reb-modal th{text-align:left;color:var(--ouro);padding:4px 6px}
  #reb-modal td{padding:5px 6px;border-top:1px solid #4a2a2a}
  #reb-modal .ok{color:#7fdc8f;font-weight:700}#reb-modal .ruim{color:#ff8a8a;font-weight:700}#reb-modal .ajuda{opacity:.7;font-size:12px}
  #reb-modal button.on{background:var(--roxo);border-color:var(--ouro);color:#fff}
  #alerta-grande{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center}
  #alerta-grande.aberto{display:flex}
  #alerta-grande .caixa{width:min(720px,92vw);background:#1e3a1e;border:4px solid #7fdc8f;border-radius:18px;padding:22px 26px;box-shadow:0 14px 50px rgba(0,0,0,.7);color:#e8ffe8;animation:pulsar 1s ease-in-out 3}
  #alerta-grande h2{margin:0 0 6px;font-size:22px;color:#b6ffb6}
  #alerta-grande .conta-alerta{opacity:.8;font-size:14px;margin-bottom:10px}
  #alerta-grande .texto{font-size:20px;font-weight:800;line-height:1.35;white-space:pre-wrap}
  #alerta-grande .mais{margin-top:8px;font-size:13px;opacity:.75}
  #alerta-grande .bts{display:flex;gap:10px;margin-top:16px;justify-content:flex-end}
  #alerta-grande button{font-size:15px;padding:8px 16px}
  @keyframes pulsar{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
  body.basica .nao-basica{display:none!important}
  #gx-fundo{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center}
  #gx-fundo.aberto{display:flex}
  #gx-modal{width:min(1150px,97vw);max-height:92vh;overflow:auto;background:#3a2020;border:3px solid var(--borda);border-radius:14px;padding:0 0 12px}
  #gx-modal header{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#c9754a;color:#2a1212;font-weight:800}
  #gx-modal section{padding:10px 14px;border-bottom:1px solid #5a3232}
  #gx-modal .linha{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
  #gx-modal select{background:#2a1515;border:1px solid #8a5a4a;color:var(--texto);border-radius:6px;padding:4px 8px;font:inherit}
  #gx-modal table{width:100%;border-collapse:collapse;font-size:12px}
  #gx-modal th{text-align:left;color:var(--ouro);padding:4px 6px;white-space:nowrap}
  #gx-modal td{padding:5px 6px;border-top:1px solid #4a2a2a;vertical-align:top}
  #gx-modal tr.eu td{background:#4a2a5a;font-weight:700}
  #gx-modal .ajuda{opacity:.7;font-size:12px}
  #ia-modal input,#ia-modal select{background:#2a1515;border:1px solid #8a5a4a;color:var(--texto);border-radius:6px;padding:4px 8px;font:inherit}#gx-modal .ok{color:#7fdc8f;font-weight:700}#gx-modal .ruim{color:#ff8a8a;font-weight:700}
  #aviso{position:fixed;left:50%;top:48px;transform:translateX(-50%);z-index:10;background:#2a1515;border:2px solid var(--ouro);border-radius:10px;padding:8px 14px;font-weight:600;display:none}
</style>
</head>
<body>
<div id="topo">
  <b>🤖 PokeIdle Multi</b>
  <button id="bt-grade" class="prim" title="Mostrar as 4 contas">Grade 2×2</button>
  <button id="bt-1x1" title="Uma conta por vez, ocupando a janela toda — troque pelas abas">1×1</button>
  <span id="abas-1x1"></span>
  <span class="esp"></span>
  <span class="info" id="info-bot">bot: carregando…</span>
  <button id="bt-proxy" class="nao-basica" title="Proxy das contas deste app (ex.: túnel até uma VPS) e o IP de saída delas">🌐 …</button>
  <button id="bt-ia" class="so-completa nao-basica" title="Agente de IA (OpenAI/Anthropic) que decide a formação do PvP e aprende com as partidas">🤖 Agente IA</button>
  <button id="bt-rankxp" class="nao-basica" title="Top 10 do ranking de XP do dia (dados do guiapokeidlehardtocapture.site) e a posição das suas contas">🏆 Ranking XP</button>
  <button id="bt-twitch" class="nao-basica" title="Quando uma live oficial do jogo entra no ar (bônus de XP), abre no seu Chrome — uma vez por live">📺 Lives → Chrome</button>
  <button id="bt-rebaixar" class="nao-basica" title="Anunciar uma pedra abaixo do mercado em todas as contas alternativas, de uma vez">📉 Pedra abaixo do mercado</button>
  <button id="bt-pasta" class="nao-basica" title="Abre a pasta onde ficam core.js e logica.js">Pasta do bot</button>
</div>
<div id="grade"></div>
<div id="aviso"></div>
<div id="reb-fundo"><div id="reb-modal"></div></div>
<div id="gx-fundo"><div id="gx-modal"></div></div>
<div id="alerta-grande"></div>

<script>
(async () => {
  const cfg = await window.multi.cfg();
  const grade = document.getElementById('grade');
  const contas = [];
  let logica = await window.multi.logica();
  let versaoLogica = '?';
  const salvar = () => window.multi.salvar({ contas: contas.map((c) => ({ nome: c.nome, zoom: c.zoom, mudo: c.mudo })) });

  function aviso(txt, ms = 4000) {
    const el = document.getElementById('aviso');
    el.textContent = txt;
    el.style.display = 'block';
    clearTimeout(aviso.t);
    aviso.t = setTimeout(() => (el.style.display = 'none'), ms);
  }

  function lerVersao(codigo) {
    const m = /VERSAO_LOGICA\s*=\s*'([^']+)'/.exec(codigo);
    return m ? m[1] : '?';
  }
  function atualizarInfo() {
    document.getElementById('info-bot').textContent = `bot: lógica v${versaoLogica} · atualiza sozinho ao salvar a pasta do bot`;
  }
  versaoLogica = lerVersao(logica);
  atualizarInfo();

  // Modo Economia do jogo. Usa os próprios controles dele: ligar = abrir Configurações e clicar
  // no interruptor (o jogo fecha o modal sozinho ao ligar); desligar = o botão "Ligar a cena".
  // O estado é a classe `modo-economia` no <html>, a mesma que o jogo usa.
  const JS_ECO_ESTADO = "document.documentElement.classList.contains('modo-economia')";
  const JS_ECO_ALTERNAR = `(() => {
    const ligado = () => document.documentElement.classList.contains('modo-economia');
    if (ligado()) { document.getElementById('eco-sair')?.click(); return ligado(); }
    document.getElementById('btn-config')?.click();
    const sw = document.getElementById('cfg-economia');
    if (sw) sw.click();
    else document.getElementById('modal-fechar')?.click();
    return ligado();
  })()`;

  async function injetarLogica(c) {
    try { await c.wv.executeJavaScript(`window.__pokeVariante = ${JSON.stringify(cfg.variante ?? '')};\n${logica}`); }
    catch (e) { console.warn('lógica não entrou na conta', c.n, e); }
  }

  // Básica: só as 4 telas e o bot de recompra (Pokébola/poção). Também sem nada do que a Lite tira.
  const basica = cfg.variante === 'basica';
  const lite = cfg.variante === 'lite' || basica;
  if (basica) { document.body.classList.add('basica'); document.title = 'PokeIdle Multi Básico'; }
  if (lite && !basica) document.title = `${document.title} Lite`;
  for (let n = 1; n <= cfg.nContas; n++) {
    const salvo = cfg.contas?.[n - 1] ?? {};
    const c = { n, nome: salvo.nome ?? `Conta ${n}`, zoom: salvo.zoom ?? 0.6, mudo: salvo.mudo ?? (n !== 1) };

    const caixa = document.createElement('div');
    caixa.className = 'conta';
    caixa.innerHTML = `
      <div class="cab">
        <span class="num">${n}</span>
        <span class="estado carregando" title="conexão"></span>
        <input class="nome" value="${c.nome.replace(/"/g, '&quot;')}" spellcheck="false" title="Clique para renomear">
        <span class="esp"></span>
        <button data-a="hunts" ${basica ? 'style="display:none"' : ''} title="Onde caçar com o pokémon ativo desta conta — calculado pelo guiapokeidlehardtocapture.site">🗺 Hunts</button>
        <button data-a="itens" ${basica ? 'style="display:none"' : ''} title="Itens principais (Boss Token, peças de TM, fragmentos) e histórico de drops por boss">📦 Itens</button>
        <button data-a="vendas" ${basica ? 'style="display:none"' : ''} title="Relatório de compras e vendas no Mercado: preço médio, taxa, lucro e preço de venda">💰 Vendas</button>
        ${lite ? '' : '<button data-a="pvp" class="eco" title="PvP: ordem que cada rival usou e trava da fila automática">⚔ PvP</button>'}
        ${lite ? '' : '<button data-a="time" title="Análise do time para PvP: quem colocar no lugar de quem">📊 Time</button>'}
        <button data-a="eco" ${basica ? 'style="display:none"' : ''} class="eco" title="Ligar/desligar o Modo Economia do jogo nesta conta">🍃 Eco</button>
        ${cfg.rotom && !basica ? '<button data-a="rotom" title="Abrir o Cockpit do Rotom Sniper desta conta">🎯 Rotom</button>' : ''}
        <button data-a="menos" title="Diminuir zoom">−</button>
        <span class="zoom"></span>
        <button data-a="mais" title="Aumentar zoom">+</button>
        <button data-a="som" title="Som desta conta"></button>
        <button data-a="foco" title="Expandir / voltar à grade">⛶</button>
        <button data-a="recarregar" title="Recarregar esta conta">⟳</button>
        <button data-a="sair" title="Deslogar esta conta">Sair</button>
      </div>`;
    const wv = document.createElement('webview');
    wv.setAttribute('partition', `persist:conta${n}`);
    wv.setAttribute('src', cfg.urlJogo);
    wv.setAttribute('allowpopups', '');
    wv.setAttribute('webpreferences', 'backgroundThrottling=no');
    caixa.appendChild(wv);
    grade.appendChild(caixa);
    Object.assign(c, { caixa, wv });
    contas.push(c);

    const elZoom = caixa.querySelector('.zoom');
    const elSom = caixa.querySelector('[data-a="som"]');
    const elEstado = caixa.querySelector('.estado');
    const pintar = () => {
      elZoom.textContent = `${Math.round(c.zoom * 100)}%`;
      elSom.textContent = c.mudo ? '🔇' : '🔊';
    };
    const elEco = caixa.querySelector('[data-a="eco"]');
    const pintarEco = (ligado) => {
      elEco.classList.toggle('on', ligado);
      elEco.textContent = ligado ? '🍃 Eco ON' : '🍃 Eco';
    };
    const elShiny = caixa.querySelector('[data-a="shiny"]');
    const lerShiny = () => !elShiny ? Promise.resolve() : wv.executeJavaScript('!!window.__pokeShiny?.ativo')
      .then((on) => { elShiny.classList.toggle('on', on); elShiny.textContent = on ? '✨ Shiny ON' : '✨ Shiny'; })
      .catch(() => {});
    const elPvp = caixa.querySelector('[data-a="pvp"]');
    const lerPvp = () => !elPvp ? Promise.resolve() : wv.executeJavaScript('!!window.__pokePvp?.trava')
      .then((on) => { elPvp.classList.toggle('on', on); elPvp.title = on ? 'PvP: trava da fila automática ligada' : 'PvP: ordem que cada rival usou e trava da fila automática'; })
      .catch(() => {});
    const lerEco = () => { lerShiny(); lerPvp(); return wv.executeJavaScript(JS_ECO_ESTADO).then(pintarEco).catch(() => {}); };
    // O modo também pode ser trocado pelo próprio jogo — o botão acompanha.
    setInterval(lerEco, 3000);
    pintar();

    wv.addEventListener('dom-ready', () => {
      wv.setZoomFactor(c.zoom);
      wv.setAudioMuted(c.mudo);
      injetarLogica(c);
    });
    wv.addEventListener('did-start-loading', () => (elEstado.className = 'estado carregando'));
    wv.addEventListener('did-stop-loading', () => (elEstado.className = 'estado ok'));
    wv.addEventListener('did-fail-load', (e) => { if (e.errorCode !== -3) elEstado.className = 'estado'; });

    caixa.querySelector('.nome').onchange = (e) => { c.nome = e.target.value.trim() || `Conta ${n}`; salvar(); };
    caixa.querySelector('.cab').onclick = async (e) => {
      const a = e.target.closest('button')?.dataset.a;
      if (!a) return;
      if (a === 'mais' || a === 'menos') {
        c.zoom = Math.min(1.5, Math.max(0.3, +(c.zoom + (a === 'mais' ? 0.05 : -0.05)).toFixed(2)));
        wv.setZoomFactor(c.zoom); pintar(); salvar();
      } else if (a === 'hunts') {
        gxHunts(c);
      } else if (a === 'itens') {
        wv.executeJavaScript('window.__pokeItens?.abrir()').catch(() => aviso('Itens: a conta ainda está carregando.'));
      } else if (a === 'vendas') {
        wv.executeJavaScript('window.__pokeVendas?.abrir()').catch(() => aviso('Vendas: a conta ainda está carregando.'));
      } else if (a === 'pvp') {
        wv.executeJavaScript('window.__pokePvp?.abrir()').catch(() => aviso('PvP: a conta ainda está carregando.'));
      } else if (a === 'time') {
        wv.executeJavaScript('window.__pokeAnalise?.abrir()').catch(() => aviso('Análise: a conta ainda está carregando.'));
      } else if (a === 'eco') {
        // Ligar o Eco com o caçador de shiny ligado deixa o caçador cego: pergunta e desliga o caçador.
        const [emEco, shinyOn] = await Promise.all([wv.executeJavaScript(JS_ECO_ESTADO).catch(() => false), wv.executeJavaScript('!!window.__pokeShiny?.ativo').catch(() => false)]);
        if (!emEco && shinyOn) {
          if (!confirm(`${c.nome ?? `Conta ${n}`}: o caçador de shiny está ligado.\n\nNo Modo Economia o jogo não mostra os bichos — o shiny levaria a bola comum (Ultra) em vez da Beast Ball.\n\nDesligar o caçador nesta conta e ligar o Eco?`)) return;
          await wv.executeJavaScript('window.__pokeShiny?.definirAtivo(false)').catch(() => {});
          lerShiny();
        }
        wv.executeJavaScript(JS_ECO_ALTERNAR).then(pintarEco).catch(() => aviso('Modo Economia: a conta ainda está carregando.'));
      } else if (a === 'rotom') {
        window.multi.abrirCockpit(n);
      } else if (a === 'som') {
        c.mudo = !c.mudo; wv.setAudioMuted(c.mudo); pintar(); salvar();
      } else if (a === 'foco') {
        focar(grade.classList.contains('solo') && caixa.classList.contains('foco') ? null : c);
      } else if (a === 'recarregar') {
        // Sem confirmação aqui: se a conta estiver em risco (hunt, boss, Arena), o próprio jogo
        // segura a saída e o app pergunta (ver 'will-prevent-unload' no main.js).
        wv.reload();
      } else if (a === 'sair') {
        if (confirm(`Deslogar "${c.nome}"? Os dados de login desta conta neste app serão apagados.`)) {
          window.multi.sairDaConta(n).then(() => wv.loadURL(cfg.urlJogo));
        }
      }
    };
  }

  function focar(c) {
    for (const x of contas) x.caixa.classList.toggle('foco', x === c);
    grade.classList.toggle('solo', !!c);
    if (c) c.wv.setZoomFactor(Math.min(1, c.zoom * 1.6));
    else for (const x of contas) x.wv.setZoomFactor(x.zoom);
    pintarLayout();
  }
  // Grade 1×1: uma conta por vez na janela toda, trocada pelas abas da barra de cima. Fica gravada.
  let modo1x1 = cfg.layout === '1x1';
  const abas1x1 = document.getElementById('abas-1x1');
  const bt1x1 = document.getElementById('bt-1x1');
  const btGrade = document.getElementById('bt-grade');
  function pintarLayout() {
    const atual = contas.find((x) => x.caixa.classList.contains('foco'));
    btGrade.classList.toggle('prim', !modo1x1 && !atual);
    bt1x1.classList.toggle('prim', modo1x1);
    abas1x1.classList.toggle('on', modo1x1);
    abas1x1.innerHTML = modo1x1 ? contas.map((x) => `<button data-n="${x.n}" class="${x === atual ? 'on' : ''}" title="${escH(x.nome)}">${x.n} ${escH(x.nome).slice(0, 10)}</button>`).join('') : '';
  }
  function usar1x1(n) {
    modo1x1 = true;
    window.multi.salvar({ layout: '1x1', conta1x1: n });
    focar(contas.find((x) => x.n === n) ?? contas[0]);
  }
  abas1x1.onclick = (e) => { const b = e.target.closest('button[data-n]'); if (b) usar1x1(Number(b.dataset.n)); };
  bt1x1.onclick = () => usar1x1(contas.find((x) => x.caixa.classList.contains('foco'))?.n ?? cfg.conta1x1 ?? 1);
  btGrade.onclick = () => { modo1x1 = false; window.multi.salvar({ layout: '2x2' }); focar(null); };
  if (modo1x1) usar1x1(cfg.conta1x1 ?? 1); else pintarLayout();
  document.getElementById('bt-pasta').onclick = () => window.multi.abrirPastaBot();

  // ---------------------------------------------------------------- pedra abaixo do mercado, em todas as contas
  // Você dá a ordem; cada conta alternativa anuncia a pedra em Coins, 5–10% abaixo do menor anúncio.
  // A conta protegida (Bekazin) é sempre pulada — a trava também existe dentro do módulo da conta.
  const reb = { info: [], nome: '', qtd: 1, desconto: '', previas: null, rodando: false, resultados: null,
    base: 'mercado', acimaMax: 8, acimaMin: 3, regras: new Map() }; // base 'rotom' = um pouco ACIMA do seu alvo de compra no Rotom
  const escH = (x) => String(x ?? '').replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
  const fmtN = (n) => Number(n ?? 0).toLocaleString('pt-BR', { maximumFractionDigits: 0 });
  const naConta = (c, js) => c.wv.executeJavaScript(js).catch(() => null);

  /**
   * Os alvos de compra do Rotom Sniper (item → preço máximo em Coins), lidos das contas. A conta
   * protegida vem primeiro: é nela que você compra, então os alvos dela valem sobre os das outras.
   */
  async function lerRegrasRotom() {
    reb.regras = new Map();
    if (!window.multi.rotomRegras) return;
    const ordem = [...reb.info].sort((a, b) => (b.i?.protegida ? 1 : 0) - (a.i?.protegida ? 1 : 0));
    for (const x of ordem) {
      const regras = await window.multi.rotomRegras(x.c.n).catch(() => null);
      for (const r of regras ?? []) {
        const alvo = Number(r.maxPriceGold) || 0;
        const nome = String(r.targetName ?? '').toLowerCase();
        if (!alvo || !nome || reb.regras.has(nome)) continue;
        const regra = { alvo, de: x.i?.nick ?? x.c.nome, ativa: r.active !== false };
        reb.regras.set(nome, regra);
        if (r.targetId != null && !reb.regras.has('#' + r.targetId)) reb.regras.set('#' + r.targetId, regra);
      }
    }
  }
  /** O alvo do Rotom para uma pedra: pelo nome ou, se a regra foi criada por id, pelo id do item. */
  function alvoRotom(nome) {
    const porNome = reb.regras.get(String(nome ?? '').toLowerCase());
    if (porNome) return porNome;
    for (const x of reb.info) for (const p of x.i?.pedras ?? []) if (p.nome === nome && reb.regras.has('#' + p.id)) return reb.regras.get('#' + p.id);
    return null;
  }

  }

    host.innerHTML = `

          Pedra <select data-reb-c="nome">${lista.map((p) => `<option ${p.nome === reb.nome ? 'selected' : ''}>${escH(p.nome)}</option>`).join('')}</select>
          <span class="ajuda">${(() => { const p = pedras.get(reb.nome); return p ? `${fmtN(p.total)} no total, em ${p.contas} conta(s)` : ''; })()}</span>
        </div>
        <div class="linha">
          Base do preço
          <button data-reb="base" data-v="mercado" class="${reb.base === 'mercado' ? 'on' : ''}">menor anúncio (abaixo dele)</button>
          <button data-reb="base" data-v="rotom" class="${reb.base === 'rotom' ? 'on' : ''}">🎯 alvo do Rotom (um pouco acima)</button>
          <span class="ajuda">${(() => { const a = alvoRotom(reb.nome); return a ? `seu alvo no Rotom para ${escH(reb.nome)}: <b>${fmtN(a.alvo)}</b> Coins (regra da ${escH(a.de)}${a.ativa ? '' : ', pausada'})` : `sem alvo no Rotom para ${escH(reb.nome)}`; })()}</span>
        </div>
        <div class="linha">
          Quantidade por conta ${[1, 2].map((n) => `<button data-reb="qtd" data-v="${n}" class="${reb.qtd === n ? 'on' : ''}">${n}</button>`).join('')}
          ${reb.base === 'rotom'
            ? `· acima do alvo: de <input data-reb-c="acimaMax" type="number" min="0" max="50" step="0.5" value="${escH(reb.acimaMax)}"> % até <input data-reb-c="acimaMin" type="number" min="0" max="50" step="0.5" value="${escH(reb.acimaMin)}"> % <span class="ajuda">(1ª conta mais alta, a última mais perto do alvo)</span>`

          : `Em COINS. Preços ESCALONADOS: cada conta um degrau abaixo da anterior (de 5% até 10%; se começar em 10% ou mais, cada uma desce 2,5% a mais), todas sobre o mesmo menor anúncio lido no "Ver preços" — antes de qualquer publicação.`}</p>

  async function abrirReb() {
    reb.previas = null; reb.resultados = null;
    document.getElementById('reb-fundo').classList.add('aberto');
    document.getElementById('reb-modal').innerHTML = '<p style="padding:14px">Lendo as contas e os alvos do Rotom…</p>';
    await lerContasReb();
    await lerRegrasRotom();
    pintarReb();
  }

  async function previaReb() {
    reb.rodando = 'lendo os preços…'; reb.resultados = null; pintarReb();
    reb.previas = new Map();
    const alvos = reb.info.filter((x) => x.i?.logado && !x.i.protegida);
    const arg = JSON.stringify({ nome: reb.nome, desconto: reb.desconto === '' ? null : Number(reb.desconto) });
    await Promise.all(alvos.map(async (x) => {
      reb.previas.set(x.c.n, (await naConta(x.c, `window.__pokeVendas.previaRebaixar(${arg})`)) ?? { erro: 'sem resposta' });
    }));
    // Escalonado: cada conta um degrau abaixo da anterior, do desconto inicial (o escolhido, ou 5%)
    // até 10%, todas sobre a MESMA referência — o menor preço lido antes de qualquer publicação.
    const comPreco = alvos.filter((x) => reb.previas.get(x.c.n)?.preco);
    const alvoR = reb.base === 'rotom' ? alvoRotom(reb.nome) : null;
    if (reb.base === 'rotom') {
      if (!alvoR) {
        for (const x of comPreco) reb.previas.set(x.c.n, { ...reb.previas.get(x.c.n), preco: null, erro: 'sem alvo no Rotom para esta pedra' });
        reb.rodando = false;
        return pintarReb();
      }
      // Um pouco ACIMA do alvo, escalonado: a 1ª conta mais alta, a última mais perto do alvo.
      // (Aqui basta a conta ter a pedra; não precisa haver anúncio no mercado.)
      const comPedra = alvos.filter((x) => reb.previas.get(x.c.n)?.itemId);
      const aMax = Math.max(0, Number(reb.acimaMax) || 0) / 100, aMin = Math.max(0, Number(reb.acimaMin) || 0) / 100;
      let anterior = Infinity;
      comPedra.forEach((x, i) => {
        const a = comPedra.length > 1 ? aMax + (aMin - aMax) * (i / (comPedra.length - 1)) : aMax;
        const pv = reb.previas.get(x.c.n);
        delete pv.erro;
        const menor = pv.fonte === 'menor anúncio' ? pv.ref : null;
        const preco = Math.max(2, Math.min(anterior - 1, Math.ceil(alvoR.alvo * (1 + a)))); // sempre abaixo da conta anterior
        anterior = preco;
        reb.previas.set(x.c.n, { ...pv, menor, alvo: alvoR.alvo, ref: alvoR.alvo, desconto: 1 - preco / alvoR.alvo, preco }); // negativo = acima do alvo
      });
      reb.rodando = false;
      return pintarReb();
    }
    const ref = Math.min(...comPreco.map((x) => reb.previas.get(x.c.n).ref));
    const d0 = reb.desconto === '' ? 0.05 : Math.max(0.01, Number(reb.desconto) / 100);
    // Degrau: distribui até 10%; se não houver espaço (ex.: começou em 10%), cada uma desce 2,5% a
    // mais — a conta seguinte fica SEMPRE abaixo da anterior.
    const passo = comPreco.length > 1 ? Math.max(0.025, (0.10 - d0) / (comPreco.length - 1)) : 0;
    comPreco.forEach((x, i) => {
      const d = d0 + passo * i;
      const pv = reb.previas.get(x.c.n);
      reb.previas.set(x.c.n, { ...pv, ref, desconto: d, preco: Math.max(2, Math.floor(ref * (1 - d))) });
    });
    reb.rodando = false;
    pintarReb();
  }

  async function publicarReb() {
    const alvos = reb.info.filter((x) => x.i?.logado && !x.i.protegida && reb.previas?.get(x.c.n)?.preco);
    if (!alvos.length) return;
    const linhas = alvos.map((x) => { const pv = reb.previas.get(x.c.n); return `${x.i.nick}: ${Math.min(pv.tem, reb.qtd)}× por ${fmtN(pv.preco)} Coins`; }).join('\n');
    const baseTxt = reb.base === 'rotom' ? `Base: um pouco acima do seu alvo no Rotom (${fmtN(alvoRotom(reb.nome)?.alvo)}).` : 'Base: abaixo do menor anúncio.';
    if (!confirm(`Publicar ${reb.nome} em ${alvos.length} conta(s)?\n\n${linhas}\n\n${baseTxt}\nMoeda: COINS. A conta protegida não entra.`)) return;
    reb.resultados = new Map();
    reb.rodando = 'publicando…'; pintarReb();
    for (const x of alvos) {
      const pv = reb.previas.get(x.c.n);
      const arg = JSON.stringify({ nome: reb.nome, qtd: reb.qtd, preco: pv.preco, itemId: pv.itemId, ref: pv.ref, desconto: Math.round(pv.desconto * 100) });
      reb.resultados.set(x.c.n, (await naConta(x.c, `window.__pokeVendas.rebaixarAgora(${arg})`)) ?? { ok: false, msg: 'sem resposta' });
      pintarReb();
    }
    reb.rodando = false;
    await lerContasReb(); // quantidades novas
    pintarReb();
    const ok = [...reb.resultados.values()].filter((r) => r.ok).length;
    aviso(`📉 ${reb.nome}: anunciado em ${ok} de ${alvos.length} conta(s)`);
  }

  // ---------------------------------------------------------------- reposição de pedras: dados para as contas
  // A cada 10 min: os alvos de compra do Rotom (os da conta protegida valem primeiro), os nicks das
  // suas contas (a reposição nunca compra de você mesmo) e o % acima do alvo de cada conta
  // alternativa (escalonado: a 1ª +8%, descendo até +3%).
  async function sincronizarReposicao() {
    if (basica) return;
    try {
      const info = await Promise.all(contas.map(async (c) => ({ c, i: await naConta(c, '(() => ({ nick: window.__pokebotCore?.eu?.nick ?? null, protegida: !!window.__pokeVendas?.infoRebaixar?.()?.protegida }))()') })));
      const alvos = {};
      for (const x of [...info].sort((a, b) => (b.i?.protegida ? 1 : 0) - (a.i?.protegida ? 1 : 0))) {
        const regras = window.multi.rotomRegras ? await window.multi.rotomRegras(x.c.n).catch(() => null) : null;
        for (const r of regras ?? []) {
          const nome = String(r.targetName ?? '').toLowerCase();
          if (nome && Number(r.maxPriceGold) > 0 && !(nome in alvos)) alvos[nome] = Number(r.maxPriceGold);
        }
      }
      const meusNicks = info.map((x) => x.i?.nick).filter(Boolean);
      const alts = info.filter((x) => x.i?.nick && !x.i.protegida);
      alts.forEach((x, i) => {
        const acima = alts.length > 1 ? 8 - (5 * i) / (alts.length - 1) : 8;
        naConta(x.c, `window.__pokeReposicao = ${JSON.stringify({ alvos, meusNicks, acima: Math.round(acima * 10) / 10, em: Date.now() })}`);
      });
      for (const x of info.filter((y) => y.i?.protegida)) naConta(x.c, 'window.__pokeReposicao = null');
    } catch (e) { console.warn('reposição: não sincronizou', e); }
  }
  setTimeout(sincronizarReposicao, 45_000);
  setInterval(sincronizarReposicao, 10 * 60_000);

  function tocarAlerta() {
    try {
      const ctx = new AudioContext();
      [880, 1175, 1568, 1175, 1568].forEach((f, i) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.frequency.value = f; g.gain.value = 0.2;
        o.connect(g).connect(ctx.destination);
        o.start(ctx.currentTime + i * 0.2); o.stop(ctx.currentTime + i * 0.2 + 0.17);
      });
    } catch {}
  }
  function mostrarAlerta(c, a) {
    alertas.unshift({ c, a, em: Date.now() });
    alertas = alertas.slice(0, 10);
    const [x, ...resto] = alertas;
    alertaFundo.innerHTML = `<div class="caixa"><h2>${escH(x.a.titulo || 'Aviso')}</h2>
      <div class="conta-alerta">conta <b>${escH(x.c.nome)}</b> · ${new Date(x.em).toLocaleTimeString('pt-BR')}</div>
      <div class="texto">${escH(x.a.texto)}</div>
      ${resto.length ? `<div class="mais">avisos anteriores: ${resto.slice(0, 3).map((r) => `${new Date(r.em).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })} — ${escH(r.a.texto.slice(0, 80))}`).join('<br>')}</div>` : ''}
      <div class="bts"><button data-al="abrir">abrir a conta ${escH(x.c.nome)}</button><button class="prim" data-al="ok">OK</button></div></div>`;
    alertaFundo.classList.add('aberto');
    alertaFundo.dataset.n = String(x.c.n);
    tocarAlerta();
    window.multi.notificar?.({ titulo: `${x.a.titulo || 'PokeIdle Multi'} — ${x.c.nome}`, texto: x.a.texto });
  }
  alertaFundo.addEventListener('click', (e) => {
    const a = e.target.closest('[data-al]')?.dataset.al;
    if (!a && e.target !== alertaFundo) return;
    if (a === 'abrir') { const c = contas.find((y) => y.n === Number(alertaFundo.dataset.n)); if (c) focar(c); }
    alertaFundo.classList.remove('aberto');
    alertas = [];
  });
  for (const c of contas) c.wv.addEventListener('ipc-message', (e) => { if (e.channel === 'pb:alerta') mostrarAlerta(c, e.args?.[0] ?? {}); });

  // ---------------------------------------------------------------- 🌐 proxy deste perfil
  const btProxy = document.getElementById('bt-proxy');
  async function pintarProxy() {
    const r = await window.multi.proxy();
    btProxy.textContent = `🌐 ${r.proxy ? 'Proxy' : 'Direto'}${r.ip ? ` · ${r.ip}` : ''}`;
    btProxy.classList.toggle('prim', !!r.proxy);
    return r;
  }
  async function abrirProxy(msg = '') {
    const r = await window.multi.proxy();
    gxFundo.classList.add('aberto');
    gxModal.innerHTML = `<header><span>🌐 Proxy das contas${r.perfil ? ` — perfil ${escH(r.perfil)}` : ''}</span><button data-gx="fechar">×</button></header>
      <section id="ia-modal">
        <div class="linha">IP de saída das contas agora: <b>${r.ip ? escH(r.ip) : `<span class="ruim">${escH(r.erro ?? '?')}</span>`}</b> ${r.proxy ? `(pelo proxy <b>${escH(r.proxy)}</b>)` : '(sua internet, direto)'}</div>
        <div class="linha">Proxy <input data-px="regra" value="${escH(r.proxy ?? '')}" placeholder="socks5://127.0.0.1:1080" style="width:260px">
          <button data-px="salvar">💾 aplicar</button> <button data-px="direto">sem proxy</button> <button data-px="testar">⟳ ver IP</button></div>
        ${msg ? `<div class="linha">${msg}</div>` : ''}
        <p class="ajuda">Só as 4 contas DESTE app saem pelo proxy (o resto — atualização do bot, guia, Twitch — segue pela sua internet). Depois de aplicar, recarregue as contas (⟳ em cada uma) para elas reconectarem pelo IP novo. Para usar o IP de uma VPS: abra o túnel SSH (ssh -N -D 1080 usuario@IP_DA_VPS) e use <b>socks5://127.0.0.1:1080</b>.</p>
      </section>`;
  }
  gxFundo.addEventListener('click', async (e) => {
    const a = e.target.closest('[data-px]')?.dataset.px;
    if (!a || e.target.tagName === 'INPUT') return;
    if (a === 'salvar' || a === 'direto') {
      const regra = a === 'direto' ? '' : gxModal.querySelector('[data-px="regra"]').value;
      e.target.disabled = true;
      const r = await window.multi.proxy(regra);
      await pintarProxy();
      abrirProxy(r.erro ? `<span class="ruim">${escH(r.erro)}</span>` : `<span class="ok">aplicado — IP de saída: ${escH(r.ip ?? r.erro ?? '?')}. Recarregue as contas (⟳).</span>`);
    } else if (a === 'testar') {
      await pintarProxy();
      abrirProxy();
    }
  });
  btProxy.onclick = () => abrirProxy();
  if (!basica) pintarProxy();
  if (cfg.proxy) document.title = `${document.title} — via proxy`;

  // ---------------------------------------------------------------- agente de IA: configuração
  let iaUltimoMsg = '';
  async function abrirIA(msg = '') {
    if (msg) iaUltimoMsg = `${msg} <span class="ajuda">(${new Date().toLocaleTimeString('pt-BR')})</span>`;
    const c = await window.multi.iaConfig();
    // As últimas decisões do agente em cada conta (do Registro do ⚔ PvP) e se ela está com "agente decide".
    const porConta = await Promise.all(contas.map(async (x) => ({ x, r: await naConta(x, `(() => { try { const c = JSON.parse(localStorage.getItem('pokepvp.v1') || '{}'); return { liga: !!c.auto?.agente, nick: window.__pokebotCore?.eu?.nick ?? null, linhas: (c.log ?? []).filter((l) => l.includes('🤖 agente') || l.includes('🤖 Agente')).slice(0, 6) }; } catch { return null; } })()`) })));
    gxFundo.classList.add('aberto');
    gxModal.innerHTML = `<header><span>🤖 Agente de IA do PvP</span><button data-gx="fechar">×</button></header>
      <section id="ia-modal">
        <div class="linha"><label><input type="checkbox" data-ia="ligado" ${c.ligado ? 'checked' : ''}> <b>Ligado</b> — as contas com "🤖 agente decide" (aba Formações do ⚔ PvP) pedem a decisão a ele</label></div>
        <div class="linha">Provedor <select data-ia="provedor"><option value="openai" ${c.provedor === 'openai' ? 'selected' : ''}>OpenAI</option><option value="anthropic" ${c.provedor === 'anthropic' ? 'selected' : ''}>Anthropic (Claude)</option></select>
          Modelo <input data-ia="modelo" value="${escH(c.modelo)}" placeholder="${c.provedor === 'anthropic' ? 'claude-sonnet-5-5' : 'gpt-4.1-mini'}" style="width:200px"></div>
        <div class="linha">Chave de API <input data-ia="chave" type="password" placeholder="${c.temChave ? '•••••••• (salva — cole outra para trocar)' : 'cole aqui a sua chave'}" style="width:340px" autocomplete="off">
          <button data-ia="salvar">💾 salvar</button>${c.temChave ? '<button data-ia="apagar">apagar chave</button>' : ''}<button data-ia="testar" ${c.temChave ? '' : 'disabled'}>⚡ testar</button></div>
        <div class="linha ajuda">${c.temChave ? '<span class="ok">✓ chave salva neste PC</span>' : 'sem chave'} · a chave fica criptografada pelo Windows no seu PC, só o processo principal do app a usa (nunca vai para as páginas do jogo nem para o GitHub).</div>
        ${iaUltimoMsg ? `<div class="linha"><b>Último teste/ação:</b>&nbsp;${iaUltimoMsg}</div>` : ''}
        <div style="margin-top:6px"><b>Decisões do agente por conta</b> <button data-ia="atualizar">⟳</button>
          ${porConta.map(({ x, r }) => `<div style="margin-top:4px"><b>${escH(x.nome)}</b>${r?.nick ? ` (${escH(r.nick)})` : ''} — ${r?.liga ? `<span class="ok">🤖 agente decide: LIGADO</span> <button data-ia="conta" data-n="${x.n}" data-v="0">desligar</button>` : `<span class="ajuda">agente decide: desligado</span> <button data-ia="conta" data-n="${x.n}" data-v="1">ligar nesta conta</button>`}
            ${r?.linhas?.length ? `<pre class="ajuda" style="white-space:pre-wrap;margin:2px 0 0">${escH(r.linhas.join(String.fromCharCode(10)))}</pre>` : '<div class="ajuda">nenhuma decisão do agente ainda</div>'}</div>`).join('')}
        </div>
        <p class="ajuda">Como funciona: depois de cada partida e antes de cada bloqueio de revanche acabar, o app manda ao modelo um resumo (quem está livre, a previsão da IA estatística, suas formações com o placar contra cada rival, hábitos e as suas regras) e ele escolhe a formação. Depois de cada partida ele reescreve um <b>caderno de lições</b> que vai junto nas próximas decisões. Se ele demorar, errar ou escolher algo que não existe, vale a escolha do modelo estatístico. Cada decisão custa uma chamada de API (frações de centavo num modelo "mini").</p>
      </section>`;
  }
  gxFundo.addEventListener('click', async (e) => {
    const a = e.target.closest('[data-ia]')?.dataset.ia;
    if (!a || e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    const val = (k) => gxModal.querySelector(`[data-ia="${k}"]`);
    if (a === 'salvar') {
      const r = await window.multi.iaConfig({ provedor: val('provedor').value, modelo: val('modelo').value, chave: val('chave').value || null, ligado: val('ligado').checked });
      abrirIA(r.erro ? `<span class="ruim">${escH(r.erro)}</span>` : '<span class="ok">salvo</span>');
    } else if (a === 'conta') {
      const x = contas.find((y) => y.n === Number(e.target.dataset.n));
      const r = x ? await naConta(x, `window.__pokePvp?.definirAgente ? window.__pokePvp.definirAgente(${e.target.dataset.v === '1'}) : 'sem'`) : null;
      abrirIA(r === 'sem' ? '<span class="ruim">o módulo de PvP desta conta ainda não atualizou — espere 1 min e tente de novo</span>' : `${escH(x?.nome ?? '')}: agente ${r ? 'LIGADO (e o auto-switch também)' : 'desligado'}`);
    } else if (a === 'atualizar') {
      abrirIA();
    } else if (a === 'apagar') {
      await window.multi.iaConfig({ apagarChave: true });
      abrirIA('chave apagada');
    } else if (a === 'testar') {
      e.target.disabled = true; e.target.textContent = 'testando…';
      const r = await window.multi.iaTestar();
      abrirIA(r.ok ? `<span class="ok">✓ ${escH(r.modelo)} respondeu: ${escH(r.resposta?.msg ?? 'ok')}</span>` : `<span class="ruim">✗ ${escH(r.erro)}</span>`);
    }
  });
  gxFundo.addEventListener('change', async (e) => {
    const a = e.target.dataset.ia;
    if (a === 'ligado') { await window.multi.iaConfig({ ligado: e.target.checked }); }
    if (a === 'provedor') { await window.multi.iaConfig({ provedor: e.target.value }); abrirIA(); }
  });
  document.getElementById('bt-ia').onclick = () => abrirIA();
  // Lite: sem agente, sem PvP, sem análise de multi-acc.
  if (lite) for (const el of document.querySelectorAll('.so-completa')) el.remove();



  // ---------------------------------------------------------------- lives da Twitch → Chrome
  // O bloco `twitch` do estado do jogo (o mesmo do modal da Twitch): `lives` no ar, `oficiais` (com
  // `bonus` = o vigia lê o chat dali) e `assistindoEm` (onde o login vinculado já foi achado).
  // A cada minuto junta as 4 contas e manda abrir as lives que ninguém está assistindo.
  let twitchLigado = cfg.twitchChrome !== false;
  const btTwitch = document.getElementById('bt-twitch');
  const pintarTwitch = () => { btTwitch.classList.toggle('prim', twitchLigado); btTwitch.textContent = `📺 Lives → Chrome: ${twitchLigado ? 'ON' : 'off'}`; };
  btTwitch.onclick = () => { twitchLigado = !twitchLigado; window.multi.salvar({ twitchChrome: twitchLigado }); pintarTwitch(); if (twitchLigado) vigiarTwitch(); };
  pintarTwitch();
  async function vigiarTwitch() {
    if (basica) return;
    if (!twitchLigado || !window.multi.twitchLives) return;
    const blocos = (await Promise.all(contas.map((c) => naConta(c, 'JSON.stringify(window.__pokebotCore?.eu?.twitch ?? null)'))))
      .map((x) => { try { return JSON.parse(x); } catch { return null; } }).filter(Boolean);
    if (!blocos.length) return;
    const assistindo = new Set(blocos.flatMap((tw) => (tw.assistindoEm ?? []).map((x) => String(x).toLowerCase())));
    const bonus = new Set(blocos.flatMap((tw) => (tw.oficiais ?? []).filter((o) => o.bonus === true).map((o) => String(o.login).toLowerCase())));
    const lives = new Map();
    for (const tw of blocos) for (const l of tw.lives ?? []) {
      const k = String(l.login ?? '').toLowerCase();
      if (k && !assistindo.has(k)) lives.set(k, { login: l.login, nome: l.nome || l.login, bonus: bonus.has(k) });
    }
    if (!lives.size) return;
    const abertas = await window.multi.twitchLives([...lives.values()]).catch(() => []);
    for (const a of abertas) aviso(`📺 ${a.nome} entrou ao vivo — abri no ${a.onde}${lives.get(String(a.login).toLowerCase())?.bonus ? ' (vale bônus de XP)' : ''}`);
  }
  setTimeout(vigiarTwitch, 20_000);
  setInterval(vigiarTwitch, 60_000);
  document.getElementById('reb-fundo').addEventListener('click', (e) => {
    if (e.target.id === 'reb-fundo') return e.currentTarget.classList.remove('aberto');
    const b = e.target.closest('[data-reb]');
    if (!b || b.disabled) return;
    const a = b.dataset.reb;
    if (a === 'fechar') document.getElementById('reb-fundo').classList.remove('aberto');
    else if (a === 'qtd') { reb.qtd = Number(b.dataset.v); pintarReb(); }
    else if (a === 'base') { reb.base = b.dataset.v; reb.escolheuBase = true; reb.previas = null; reb.resultados = null; pintarReb(); }
    else if (a === 'previa') previaReb();
    else if (a === 'publicar') publicarReb();
  });
  document.getElementById('reb-fundo').addEventListener('change', (e) => {
    const c = e.target.dataset.rebC;
    if (!c) return;
    reb[c] = e.target.value;
    reb.previas = null; reb.resultados = null;
    pintarReb();
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') focar(null); });

  // Atualização ao vivo: lógica nova entra nas 4 contas sem recarregar nada.
  window.multi.aoMudarLogica((codigo) => {
    logica = codigo;
    versaoLogica = lerVersao(codigo);
    atualizarInfo();
    for (const c of contas) injetarLogica(c);
    aviso(`🤖 Bot atualizado nas ${contas.length} contas — lógica v${versaoLogica}`);
  });
  window.multi.aoMudarCore(() => {
    for (const c of contas) c.wv.executeJavaScript("window.postMessage({ pokebot: 'core-mudou' }, location.origin)").catch(() => {});
    aviso('🤖 Núcleo do bot atualizado — recarregue cada conta (⟳) quando ela estiver no Centro Pokémon.', 8000);
  });
})();
</script>
