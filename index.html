<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
<title>PokeIdle Multi</title>
<style>
  :root{--fundo:#1d1010;--barra:#3a2020;--borda:#e2915a;--texto:#f6e7d4;--roxo:#b04ad0;--ouro:#f3c77a}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--fundo);color:var(--texto);font:13px system-ui,sans-serif;overflow:hidden}
  #topo{height:38px;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--barra);border-bottom:2px solid var(--borda)}
  #topo b{color:var(--ouro);letter-spacing:.5px;margin-right:8px}
  #topo .esp{flex:1}
  /* Janela estreita: a barra fica numa linha só — botões só com o ícone (o nome segue no title),
     sem o texto da versão do bot, e rolando de lado se ainda não couber. */
  #topo{overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
  #topo>*{flex:none;white-space:nowrap}
  #topo .esp{flex:1 1 0;min-width:0}
  @media (max-width: 1500px){#topo .rot,#topo .info{display:none}}
  #topo .info{opacity:.75;font-size:12px}
  button{background:#5a3232;border:1px solid #8a5a4a;color:var(--texto);border-radius:6px;padding:4px 9px;cursor:pointer;font:inherit}
  button:hover{background:#6e3d3d}
  button.prim{background:var(--roxo);border-color:var(--ouro);color:#fff}
  #grade{position:absolute;top:38px;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:4px;padding:4px}
  #grade.solo{grid-template-columns:1fr;grid-template-rows:1fr}
  #grade:not(.solo) .conta.fora{display:none}
  /* Telas ocultas: as contas seguem jogando (bot, rota, PvP), só não são desenhadas — sem placa de
     vídeo, desenhar é ~4× o custo de uma conta escondida. */
  #grade.oculto .conta{display:none}
  #oculto-aviso{display:none;position:absolute;top:38px;left:0;right:0;bottom:0;align-items:center;justify-content:center;flex-direction:column;gap:10px;font-size:15px;opacity:.85}
  #oculto-aviso.on{display:flex}
  /* Painel: um cartão por conta com o estado e os comandos; o jogo roda escondido (não é desenhado). */
  #painel{position:absolute;top:38px;left:0;right:0;bottom:0;display:none;overflow:auto;padding:10px;gap:10px;grid-template-columns:repeat(auto-fill,minmax(370px,1fr));align-content:start}
  #painel.on{display:grid}
  .pc{background:#2a1515;border:2px solid #5a3232;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.55}
  .pc header{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .pc header b{font-size:15px;color:var(--ouro)}
  .pc .ponto{width:9px;height:9px;border-radius:50%;background:#888}.pc .ponto.ok{background:#6f6;box-shadow:0 0 5px #6f6}.pc .ponto.ruim{background:#f66}
  .pc .rot{opacity:.7}
  .pc .acoes{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
  .pc select{background:#3a2020;border:1px solid #8a5a4a;color:var(--texto);border-radius:6px;padding:3px 6px;max-width:200px;font:inherit}
  .pc .log{margin-top:6px;font-size:11px;opacity:.75;white-space:pre-wrap;max-height:4.8em;overflow:hidden}
  .pc button.on{background:#2f6b3a;border-color:#7fdc8f}
  .pc .drops b{color:#7fdc8f}
  #painel-total{grid-column:1/-1;background:#3a2020;border:2px solid var(--borda);border-radius:10px;padding:8px 12px;font-size:13px}
  #painel-total b{color:var(--ouro)}
  #paginas{display:flex;gap:4px}
  #grade.solo .conta:not(.foco){display:none}
  #abas-1x1{display:none;gap:4px}#abas-1x1.on{display:flex}
  #abas-1x1 button.on{background:var(--roxo);border-color:var(--ouro);color:#fff}
  .conta{position:relative;display:flex;flex-direction:column;border:2px solid #5a3232;border-radius:8px;overflow:hidden;background:#000;min-width:0;min-height:0}
  .conta.foco{border-color:var(--borda)}
  .cab{height:28px;flex:none;display:flex;align-items:center;gap:6px;padding:0 6px;background:var(--barra)}
  .cab .num{background:var(--roxo);color:#fff;border-radius:5px;padding:1px 7px;font-weight:800}
  .cab input.nome{background:transparent;border:1px solid transparent;color:var(--texto);font:600 13px system-ui;width:140px;border-radius:5px;padding:2px 4px}
  .cab input.nome:hover,.cab input.nome:focus{border-color:#8a5a4a;outline:none;background:#2a1515}
  .cab .esp{flex:1}
  /* Quadro estreito (grade 2×2 em tela pequena): os botões ficam só com o ícone — o nome continua
     no title — e, se ainda não couber, a barra rola de lado em vez de quebrar os botões. */
  .conta{container-type:inline-size}
  .cab{overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
  .cab>*{flex:none}
  .cab .esp{flex:1 1 0;min-width:0}
  .cab button{white-space:nowrap}
  @container (max-width: 1150px){.conta .cab .rot{display:none}.conta .cab input.nome{width:100px}}
  @container (max-width: 700px){.conta .cab{gap:3px;padding:0 3px}.conta .cab button{padding:1px 5px}.conta .cab input.nome{width:70px}.conta .cab .zoom{min-width:30px}}
  .cab .zoom{min-width:38px;text-align:center;opacity:.8;font-size:12px}
  .cab button{padding:1px 7px;font-size:12px}
  .cab button.eco.on,.cab button.proxy.on{background:#2f6b3a;border-color:#7fdc8f}
  .cab .estado{width:9px;height:9px;border-radius:50%;background:#888}
  .cab .estado.ok{background:#6f6;box-shadow:0 0 5px #6f6}
  .cab .estado.carregando{background:#fc6}
  webview{flex:1;width:100%;min-height:0}
  #reb-fundo{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center}
  #reb-fundo.aberto{display:flex}
  #reb-modal{width:min(820px,95vw);max-height:90vh;overflow:auto;background:#3a2020;border:3px solid var(--borda);border-radius:14px;padding:0 0 12px}
  #reb-modal header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#c9754a;color:#2a1212;font-weight:800}
  #reb-modal section{padding:10px 14px;border-bottom:1px solid #5a3232}
  #reb-modal .linha{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
  #reb-modal select,#reb-modal input{background:#2a1515;border:1px solid #8a5a4a;color:var(--texto);border-radius:6px;padding:4px 8px;font:inherit}
  #reb-modal input{width:64px}
  #reb-modal table{width:100%;border-collapse:collapse;font-size:12px}
  #reb-modal th{text-align:left;color:var(--ouro);padding:4px 6px}
  #reb-modal td{padding:5px 6px;border-top:1px solid #4a2a2a}
  #reb-modal .ok{color:#7fdc8f;font-weight:700}#reb-modal .ruim{color:#ff8a8a;font-weight:700}#reb-modal .ajuda{opacity:.7;font-size:12px}
  #reb-modal button.on{background:var(--roxo);border-color:var(--ouro);color:#fff}
  #gx-fundo{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center}
  #gx-fundo.aberto{display:flex}
  #gx-modal{width:min(1150px,97vw);max-height:92vh;overflow:auto;background:#3a2020;border:3px solid var(--borda);border-radius:14px;padding:0 0 12px}
  #gx-modal header{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#c9754a;color:#2a1212;font-weight:800}
  #gx-modal section{padding:10px 14px;border-bottom:1px solid #5a3232}
  #gx-modal .linha{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
  #gx-modal select{background:#2a1515;border:1px solid #8a5a4a;color:var(--texto);border-radius:6px;padding:4px 8px;font:inherit}
  #gx-modal table{width:100%;border-collapse:collapse;font-size:12px}
  #gx-modal th{text-align:left;color:var(--ouro);padding:4px 6px;white-space:nowrap}
  #gx-modal td{padding:5px 6px;border-top:1px solid #4a2a2a;vertical-align:top}
  #gx-modal tr.eu td{background:#4a2a5a;font-weight:700}
  #gx-modal .ajuda{opacity:.7;font-size:12px}
  #ia-modal input,#ia-modal select,#px-modal input,#anu-modal input,#anu-modal select,#bons-modal input,#bons-modal select{background:#2a1515;border:1px solid #8a5a4a;color:var(--texto);border-radius:6px;padding:4px 8px;font:inherit}#gx-modal .ok{color:#7fdc8f;font-weight:700}#gx-modal .ruim{color:#ff8a8a;font-weight:700}
  #aviso{position:fixed;left:50%;top:48px;transform:translateX(-50%);z-index:10;background:#2a1515;border:2px solid var(--ouro);border-radius:10px;padding:8px 14px;font-weight:600;display:none}
</style>
</head>
<body>
<div id="topo">
  <b>🤖 PokeIdle Multi</b>
  <button id="bt-grade" class="prim" title="Mostrar as 4 contas da página">Grade 2×2</button>
  <button id="bt-1x1" title="Uma conta por vez, ocupando a janela toda — troque pelas abas">1×1</button>
  <span id="paginas"></span>
  <button id="bt-painel" title="Painel: o estado de cada conta e os comandos, sem desenhar o jogo (o mais leve para a VPS)">📋<span class="rot"> Painel</span></button>
  <button id="bt-bons" title="Os pokémon bons (Coleção) de todas as contas, para programar o anúncio de cada um no Mercado">⭐<span class="rot"> Bons</span></button>
  <button id="bt-anunciar" title="Anunciar no Mercado um item escolhido, em todas as contas de uma vez">📢<span class="rot"> Anunciar</span></button>
  <button id="bt-ocultar" title="Esconde as telas das contas para poupar a VPS — elas continuam jogando">🙈<span class="rot"> Ocultar telas</span></button>
  <span id="abas-1x1"></span>
  <span class="esp"></span>
  <span class="info" id="info-bot">bot: carregando…</span>
  <button id="bt-ia" class="so-completa" title="Agente de IA (OpenAI/Anthropic) que decide a formação do PvP e aprende com as partidas">🤖<span class="rot"> Agente IA</span></button>
  <button id="bt-rankxp" title="Top 10 do ranking de XP do dia (dados do guiapokeidlehardtocapture.site) e a posição das suas contas">🏆<span class="rot"> Ranking XP</span></button>
  <button id="bt-twitch" title="Quando uma live oficial do jogo entra no ar (bônus de XP), abre no seu Chrome — uma vez por live">📺 Lives → Chrome</button>
  <button id="bt-rebaixar" title="Anunciar uma pedra abaixo do mercado em todas as contas alternativas, de uma vez">📉<span class="rot"> Pedra abaixo do mercado</span></button>
  <button id="bt-pasta" title="Abre a pasta onde ficam core.js e logica.js">📁<span class="rot"> Pasta do bot</span></button>
</div>
<div id="grade"></div>
<div id="painel"></div>
<div id="oculto-aviso"><div>🙈 Telas ocultas — as contas continuam jogando normalmente.</div><button id="bt-mostrar" class="prim">Mostrar as telas</button></div>
<div id="aviso"></div>
<div id="reb-fundo"><div id="reb-modal"></div></div>
<div id="gx-fundo"><div id="gx-modal"></div></div>

<script>
(async () => {
  const cfg = await window.multi.cfg();
  const grade = document.getElementById('grade');
  const contas = [];
  let logica = await window.multi.logica();
  let versaoLogica = '?';
  const salvar = () => window.multi.salvar({ contas: contas.map((c) => ({ nome: c.nome, zoom: c.zoom, mudo: c.mudo })) });

  function aviso(txt, ms = 4000) {
    const el = document.getElementById('aviso');
    el.textContent = txt;
    el.style.display = 'block';
    clearTimeout(aviso.t);
    aviso.t = setTimeout(() => (el.style.display = 'none'), ms);
  }

  function lerVersao(codigo) {
    const m = /VERSAO_LOGICA\s*=\s*'([^']+)'/.exec(codigo);
    return m ? m[1] : '?';
  }
  function atualizarInfo() {
    document.getElementById('info-bot').textContent = `bot: lógica v${versaoLogica} · atualiza sozinho ao salvar a pasta do bot`;
  }
  versaoLogica = lerVersao(logica);
  atualizarInfo();

  // Modo Economia do jogo. Usa os próprios controles dele: ligar = abrir Configurações e clicar
  // no interruptor (o jogo fecha o modal sozinho ao ligar); desligar = o botão "Ligar a cena".
  // O estado é a classe `modo-economia` no <html>, a mesma que o jogo usa.
  const JS_ECO_ESTADO = "document.documentElement.classList.contains('modo-economia')";
  const JS_ECO_ALTERNAR = `(() => {
    const ligado = () => document.documentElement.classList.contains('modo-economia');
    if (ligado()) { document.getElementById('eco-sair')?.click(); return ligado(); }
    document.getElementById('btn-config')?.click();
    const sw = document.getElementById('cfg-economia');
    if (sw) sw.click();
    else document.getElementById('modal-fechar')?.click();
    return ligado();
  })()`;

  async function injetarLogica(c) {
    try { await c.wv.executeJavaScript(`window.__pokeVariante = ${JSON.stringify(cfg.variante ?? '')};\n${logica}`); }
    catch (e) { console.warn('lógica não entrou na conta', c.n, e); }
  }

  const lite = cfg.variante === 'lite';
  // Definida aqui em cima: no modo 1×1 o pintarLayout() roda já na montagem e usava escH antes de
  // ela existir — o erro parava o script e as abas de troca de conta nunca apareciam.
  const escH = (x) => String(x ?? '').replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
  // À vista = a conta em foco (grade 1×1 / ⛶) ou, na grade, as da página aberta.
  // Zoom de uma conta: a em foco (1×1 / ⛶) fica maior. Só com a página pronta — antes do dom-ready o
  // setZoomFactor lança erro, e no 1×1 isso derrubava a montagem da janela inteira na abertura.
  const aplicarZoom = (x) => {
    if (!x?.pronta) return;
    const foco = grade.classList.contains('solo') && x.caixa.classList.contains('foco');
    try { x.wv.setZoomFactor(foco ? Math.min(1, x.zoom * 1.6) : x.zoom); } catch {}
  };
  const contaEscondida = (c) => grade.classList.contains('oculto') || (grade.classList.contains('solo') ? !c.caixa.classList.contains('foco') : c.caixa.classList.contains('fora'));
  if (lite) document.title = `${document.title} Lite`;
  for (let n = 1; n <= cfg.nContas; n++) {
    const salvo = cfg.contas?.[n - 1] ?? {};
    const c = { n, nome: salvo.nome ?? `Conta ${n}`, zoom: salvo.zoom ?? 0.6, mudo: salvo.mudo ?? (n !== 1) };

    const caixa = document.createElement('div');
    caixa.className = 'conta';
    caixa.innerHTML = `
      <div class="cab">
        <span class="num">${n}</span>
        <span class="estado carregando" title="conexão"></span>
        <input class="nome" value="${c.nome.replace(/"/g, '&quot;')}" spellcheck="false" title="Clique para renomear">
        <span class="esp"></span>
        ${lite ? '' : '<button data-a="shiny" class="eco" title="Caçador de shiny: registra os bichos do mapa e arremessa Great Ball quando um shiny cai">✨<span class="rot"> Shiny</span></button>'}
        <button data-a="rota" class="eco" title="Rota de upar: Geodude → Diglett → (40: Centro, 2 Water Stone, evolui) → Larvitar → (80: evolui) → Pupitar → (200) Brave Charizard na Outland">🧭<span class="rot"> Rota</span></button>
        <button data-a="hunts" title="Onde caçar com o pokémon ativo desta conta — calculado pelo guiapokeidlehardtocapture.site">🗺<span class="rot"> Hunts</span></button>
        <button data-a="itens" title="Itens principais (Boss Token, peças de TM, fragmentos) e histórico de drops por boss">📦<span class="rot"> Itens</span></button>
        <button data-a="vendas" title="Relatório de compras e vendas no Mercado: preço médio, taxa, lucro e preço de venda">💰<span class="rot"> Vendas</span></button>
        ${lite ? '' : '<button data-a="pvp" class="eco" title="PvP: ordem que cada rival usou e trava da fila automática">⚔<span class="rot"> PvP</span></button>'}
        ${lite ? '' : '<button data-a="time" title="Análise do time para PvP: quem colocar no lugar de quem">📊<span class="rot"> Time</span></button>'}
        <button data-a="eco" class="eco" title="Ligar/desligar o Modo Economia do jogo nesta conta">🍃<span class="rot"> Eco</span></button>
        ${cfg.rotom ? '<button data-a="rotom" title="Abrir o Cockpit do Rotom Sniper desta conta">🎯<span class="rot"> Rotom</span></button>' : ''}
        <button data-a="menos" title="Diminuir zoom">−</button>
        <span class="zoom"></span>
        <button data-a="mais" title="Aumentar zoom">+</button>
        <button data-a="som" title="Som desta conta"></button>
        <button data-a="foco" title="Expandir / voltar à grade">⛶</button>
        <button data-a="recarregar" title="Recarregar esta conta">⟳</button>
        <button data-a="proxy" class="proxy" title="Proxy desta conta">🌐</button>
        <button data-a="sair" title="Deslogar esta conta">Sair</button>
      </div>`;
    const wv = document.createElement('webview');
    wv.setAttribute('partition', `persist:conta${n}`);
    // Carga sob demanda: na abertura só entram as contas da página que aparece e as que já estavam
    // logadas — uma conta parada na tela de login gasta ~200 MB à toa. As outras carregam quando a
    // página (ou a aba 1×1) delas é aberta. Até lá, executeJavaScript dela falha como "carregando".
    const naPaginaInicial = Math.floor((n - 1) / 4) === (cfg.pagina ?? 0);
    // Conta sem tela: joga numa janela invisível do processo principal (ver main.js), sem o jogo.
    // A webview dela nunca carrega — duas sessões na mesma conta se derrubariam.
    c.semTela = (cfg.semTela ?? []).map(Number).includes(n);
    c.pendente = c.semTela || (!naPaginaInicial && !cfg.logadas?.[n]);
    if (c.pendente) {
      const executar = wv.executeJavaScript.bind(wv);
      wv.executeJavaScript = (...args) => (c.pendente ? Promise.reject(new Error('conta ainda não carregada')) : executar(...args));
    } else {
      wv.setAttribute('src', cfg.urlJogo);
    }
    c.carregar = () => {
      if (c.semTela) return;
      if (c.descarregada) { c.descarregada = false; wv.loadURL(cfg.urlJogo).catch(() => {}); return; }
      if (!c.pendente || c.carregando) return;
      c.carregando = true;
      wv.setAttribute('src', cfg.urlJogo);
    };
    // Deslogada e escondida: a tela de login do jogo tem o captcha da Cloudflare, que recria um
    // processo a cada minuto (20–35% de CPU cada). Descarrega; volta ao abrir a página dela.
    c.descarregar = () => { if (c.pendente || c.descarregada) return; c.descarregada = true; c.pronta = false; wv.loadURL('about:blank').catch(() => {}); };
    // Avisa a página se ela está à vista — o limite de quadros da lógica cai para 1/s escondida.
    c.avisarVisibilidade = () => { if (c.pronta && !c.descarregada) wv.executeJavaScript(`window.__pbEscondida = ${contaEscondida(c)}`).catch(() => {}); };
    wv.setAttribute('allowpopups', '');
    wv.setAttribute('webpreferences', 'backgroundThrottling=no');
    caixa.appendChild(wv);
    grade.appendChild(caixa);
    Object.assign(c, { caixa, wv });
    contas.push(c);

    const elZoom = caixa.querySelector('.zoom');
    const elSom = caixa.querySelector('[data-a="som"]');
    const elEstado = caixa.querySelector('.estado');
    const pintar = () => {
      elZoom.textContent = `${Math.round(c.zoom * 100)}%`;
      elSom.textContent = c.mudo ? '🔇' : '🔊';
    };
    const elEco = caixa.querySelector('[data-a="eco"]');
    const pintarEco = (ligado) => {
      elEco.classList.toggle('on', ligado);
      elEco.innerHTML = `🍃<span class="rot"> Eco${ligado ? ' ON' : ''}</span>`;
    };
    const elShiny = caixa.querySelector('[data-a="shiny"]');
    const lerShiny = () => !elShiny ? Promise.resolve() : wv.executeJavaScript('!!window.__pokeShiny?.ativo')
      .then((on) => { elShiny.classList.toggle('on', on); elShiny.innerHTML = `✨<span class="rot"> Shiny${on ? ' ON' : ''}</span>`; })
      .catch(() => {});
    const elPvp = caixa.querySelector('[data-a="pvp"]');
    const lerPvp = () => !elPvp ? Promise.resolve() : wv.executeJavaScript('!!window.__pokePvp?.trava')
      .then((on) => { elPvp.classList.toggle('on', on); elPvp.title = on ? 'PvP: trava da fila automática ligada' : 'PvP: ordem que cada rival usou e trava da fila automática'; })
      .catch(() => {});
    const elRota = caixa.querySelector('[data-a="rota"]');
    const lerRota = () => wv.executeJavaScript('window.__pokeRota ? { on: window.__pokeRota.ativo, st: window.__pokeRota.status } : null')
      .then((r) => { elRota.classList.toggle('on', !!r?.on); elRota.innerHTML = `🧭<span class="rot"> Rota${r?.on ? ' ON' : ''}</span>`; elRota.title = r?.on ? `Rota: ${r.st}` : 'Rota de upar: Geodude → Diglett → (40: Centro, 2 Water Stone, evolui) → Larvitar → (80: evolui) → Pupitar → (200) Brave Charizard na Outland'; })
      .catch(() => {});
    // Lembra quem está logado, para carregar essa conta já na abertura da próxima vez.
    const lerLogada = () => wv.executeJavaScript('({ l: !!window.__pokebotCore?.logado, nick: window.__pokebotCore?.eu?.nick ?? null })').then(({ l, nick }) => {
      // Nome da conta = nick do jogo, enquanto ela tiver o nome padrão ("Conta N") ou o nick anterior;
      // um nome escrito à mão no cabeçalho continua valendo.
      if (nick && nick !== c.nome && (/^Conta \d+$/.test(c.nome) || c.nome === c.nickAnterior)) {
        c.nome = c.nickAnterior = nick;
        caixa.querySelector('.nome').value = nick;
        salvar();
        pintarLayout();
      } else if (nick) c.nickAnterior ??= nick === c.nome ? nick : undefined;
      c.logada = l;
      // Descarregar só a conta deslogada de propósito (botão Sair). Uma conta logada também fica com
      // `logado` falso quando cai a conexão com o servidor — antes isso descarregava as escondidas
      // do 1×1 e elas paravam de jogar até alguém abrir a aba delas.
      if (!l && !cfg.logadas?.[n] && contaEscondida(c) && !c.pendente && !c.descarregada) {
        c.escondidaDesde ??= Date.now();
        if (Date.now() - c.escondidaDesde > 120_000) c.descarregar();
      } else c.escondidaDesde = null;
      // Conta logada e desconectada há mais de 3 min (queda do servidor, do proxy): recarrega para
      // reconectar. O jogo segura a saída se estiver em luta (ver 'will-prevent-unload' no main.js).
      if (!l && cfg.logadas?.[n] && c.pronta && !c.descarregada) {
        c.semConexaoDesde ??= Date.now();
        if (Date.now() - c.semConexaoDesde > 180_000) { c.semConexaoDesde = null; try { wv.reload(); } catch {} }
      } else c.semConexaoDesde = null;
      // Só anota o login. "Deslogada" só pelo botão Sair: o `false` também aparece em recargas e
      // reconexões, e uma conta anotada errado não carregava na abertura seguinte.
      if (!l || cfg.logadas?.[n]) return;
      cfg.logadas = { ...(cfg.logadas ?? {}), [n]: true };
      window.multi.salvar({ logadas: cfg.logadas });
    }).catch(() => {});
    const lerEco = () => { lerShiny(); lerPvp(); lerRota(); lerLogada(); return wv.executeJavaScript(JS_ECO_ESTADO).then(pintarEco).catch(() => {}); };
    // O modo também pode ser trocado pelo próprio jogo — o botão acompanha.
    setInterval(lerEco, 3000);
    pintar();
    const elProxy = caixa.querySelector('[data-a="proxy"]');
    c.pintarProxy = (p) => {
      elProxy.classList.toggle('on', !!p?.url);
      elProxy.title = p?.url ? `Proxy: ${p.url}${p.usuario ? ` (usuário ${p.usuario})` : ''}` : 'Proxy desta conta: nenhum (conexão direta)';
    };
    window.multi.proxy(n).then(c.pintarProxy);

    wv.addEventListener('dom-ready', () => {
      if (wv.getURL().startsWith('about:')) return; // conta descarregada
      c.pendente = false;
      c.pronta = true; // dom-ready: daqui em diante dá para falar com a página
      aplicarZoom(c);
      wv.setAudioMuted(c.mudo);
      injetarLogica(c).then(c.avisarVisibilidade);
    });
    wv.addEventListener('did-start-loading', () => (elEstado.className = 'estado carregando'));
    wv.addEventListener('did-stop-loading', () => (elEstado.className = 'estado ok'));
    wv.addEventListener('did-fail-load', (e) => { if (e.errorCode !== -3) elEstado.className = 'estado'; });

    // Cabeçalho que não coube: a rodinha do mouse rola ele de lado (a barra de rolagem fica escondida).
    caixa.querySelector('.cab').addEventListener('wheel', (e) => {
      const cab = e.currentTarget;
      if (cab.scrollWidth <= cab.clientWidth || !e.deltaY) return;
      cab.scrollLeft += e.deltaY;
      e.preventDefault();
    }, { passive: false });
    caixa.querySelector('.nome').onchange =(e) => { c.nome = e.target.value.trim() || `Conta ${n}`; salvar(); };
    caixa.querySelector('.cab').onclick = async (e) => {
      const a = e.target.closest('button')?.dataset.a;
      if (!a) return;
      if (a === 'mais' || a === 'menos') {
        c.zoom = Math.min(1.5, Math.max(0.3, +(c.zoom + (a === 'mais' ? 0.05 : -0.05)).toFixed(2)));
        aplicarZoom(c); pintar(); salvar();
      } else if (a === 'shiny') {
        wv.executeJavaScript('window.__pokeShiny?.abrir()').catch(() => aviso('Shiny: a conta ainda está carregando.'));
      } else if (a === 'rota') {
        const r = await wv.executeJavaScript('window.__pokeRota ? { on: window.__pokeRota.ativo, st: window.__pokeRota.status, max: window.__pokeRota.precoMax, log: window.__pokeRota.log.slice(0, 8) } : null').catch(() => null);
        if (!r) return aviso('Rota: a conta ainda está carregando.');
        const ultimas = r.log.length ? `\n\nÚltimos passos:\n${r.log.join('\n')}` : '';
        if (r.on) {
          if (confirm(`${c.nome}: rota LIGADA — ${r.st}${ultimas}\n\nDesligar a rota nesta conta?`)) await wv.executeJavaScript('window.__pokeRota.definirAtivo(false)');
        } else if (confirm(`${c.nome}: ligar a rota de upar no pokémon ATIVO?\n\n• nv 1–10 Geodude · 11–39 Diglett\n• nv 40: volta ao Centro, compra 2 Water Stone no Mercado (até ${r.max.toLocaleString('pt-BR')} Coins cada) e evolui (Squirtle → Wartortle), depois Larvitar\n• nv 80: Centro e evolui de novo (Wartortle → Blastoise), volta ao Larvitar\n• nv 100–199 Pupitar\n• nv 200: Brave Charizard, na Outland (libera com treinador nv 150)${ultimas}`)) {
          await wv.executeJavaScript('window.__pokeRota.definirAtivo(true)');
        }
        lerRota();
      } else if (a === 'hunts') {
        gxHunts(c);
      } else if (a === 'itens') {
        wv.executeJavaScript('window.__pokeItens?.abrir()').catch(() => aviso('Itens: a conta ainda está carregando.'));
      } else if (a === 'vendas') {
        wv.executeJavaScript('window.__pokeVendas?.abrir()').catch(() => aviso('Vendas: a conta ainda está carregando.'));
      } else if (a === 'pvp') {
        wv.executeJavaScript('window.__pokePvp?.abrir()').catch(() => aviso('PvP: a conta ainda está carregando.'));
      } else if (a === 'time') {
        wv.executeJavaScript('window.__pokeAnalise?.abrir()').catch(() => aviso('Análise: a conta ainda está carregando.'));
      } else if (a === 'eco') {
        // Ligar o Eco com o caçador de shiny ligado deixa o caçador cego: pergunta e desliga o caçador.
        const [emEco, shinyOn] = await Promise.all([wv.executeJavaScript(JS_ECO_ESTADO).catch(() => false), wv.executeJavaScript('!!window.__pokeShiny?.ativo').catch(() => false)]);
        if (!emEco && shinyOn) {
          if (!confirm(`${c.nome ?? `Conta ${n}`}: o caçador de shiny está ligado.\n\nNo Modo Economia o jogo não mostra os bichos — o shiny levaria a bola comum (Ultra) em vez da Beast Ball.\n\nDesligar o caçador nesta conta e ligar o Eco?`)) return;
          await wv.executeJavaScript('window.__pokeShiny?.definirAtivo(false)').catch(() => {});
          lerShiny();
        }
        wv.executeJavaScript(JS_ECO_ALTERNAR).then(pintarEco).catch(() => aviso('Modo Economia: a conta ainda está carregando.'));
      } else if (a === 'rotom') {
        window.multi.abrirCockpit(n);
      } else if (a === 'som') {
        c.mudo = !c.mudo; wv.setAudioMuted(c.mudo); pintar(); salvar();
      } else if (a === 'foco') {
        focar(grade.classList.contains('solo') && caixa.classList.contains('foco') ? null : c);
      } else if (a === 'recarregar') {
        // Sem confirmação aqui: se a conta estiver em risco (hunt, boss, Arena), o próprio jogo
        // segura a saída e o app pergunta (ver 'will-prevent-unload' no main.js).
        wv.reload();
      } else if (a === 'proxy') {
        abrirProxy(c);
      } else if (a === 'sair') {
        if (confirm(`Deslogar "${c.nome}"? Os dados de login desta conta neste app serão apagados.`)) {
          cfg.logadas = { ...(cfg.logadas ?? {}), [n]: false };
          window.multi.salvar({ logadas: cfg.logadas });
          window.multi.sairDaConta(n).then(() => wv.loadURL(cfg.urlJogo));
        }
      }
    };
  }

  function focar(c) {
    c?.carregar?.();
    for (const x of contas) x.caixa.classList.toggle('foco', x === c);
    grade.classList.toggle('solo', !!c);
    for (const x of contas) aplicarZoom(x);
    pintarLayout();
    for (const x of contas) x.avisarVisibilidade();
  }
  // Grade 1×1: uma conta por vez na janela toda, trocada pelas abas da barra de cima. Fica gravada.
  let modo1x1 = cfg.layout === '1x1';
  const abas1x1 = document.getElementById('abas-1x1');
  const bt1x1 = document.getElementById('bt-1x1');
  const btGrade = document.getElementById('bt-grade');
  function pintarLayout() {
    const atual = contas.find((x) => x.caixa.classList.contains('foco'));
    btGrade.classList.toggle('prim', !modo1x1 && !atual);
    bt1x1.classList.toggle('prim', modo1x1);
    abas1x1.classList.toggle('on', modo1x1);
    abas1x1.innerHTML = modo1x1 ? contas.map((x) => `<button data-n="${x.n}" class="${x === atual ? 'on' : ''}" title="${escH(x.nome)}">${x.n} ${escH(x.nome).slice(0, 10)}</button>`).join('') : '';
  }
  function usar1x1(n) {
    modo1x1 = true;
    window.multi.salvar({ layout: '1x1', conta1x1: n });
    focar(contas.find((x) => x.n === n) ?? contas[0]);
  }
  abas1x1.onclick = (e) => { const b = e.target.closest('button[data-n]'); if (b) usar1x1(Number(b.dataset.n)); };
  bt1x1.onclick = () => usar1x1(contas.find((x) => x.caixa.classList.contains('foco'))?.n ?? cfg.conta1x1 ?? 1);
  btGrade.onclick = () => { modo1x1 = false; window.multi.salvar({ layout: '2x2' }); focar(null); };
  // Páginas da grade: 4 contas por vez (1–4, 5–8). As da outra página continuam rodando (bot,
  // hunts, PvP) — só ficam escondidas. Fica gravada.
  const POR_PAGINA = 4;
  const nPaginas = Math.ceil(contas.length / POR_PAGINA);
  let pagina = Math.min(cfg.pagina ?? 0, nPaginas - 1);
  const elPaginas = document.getElementById('paginas');
  function mostrarPagina(p) {
    pagina = p;
    contas.forEach((x, i) => { if (Math.floor(i / POR_PAGINA) === p) x.carregar(); });
    contas.forEach((x, i) => x.caixa.classList.toggle('fora', Math.floor(i / POR_PAGINA) !== p));
    for (const x of contas) x.avisarVisibilidade();
    elPaginas.innerHTML = nPaginas > 1 ? [...Array(nPaginas).keys()].map((i) => `<button data-p="${i}" class="${i === pagina ? 'prim' : ''}" title="Mostrar as contas ${i * POR_PAGINA + 1} a ${Math.min(contas.length, (i + 1) * POR_PAGINA)} na grade">Contas ${i * POR_PAGINA + 1}–${Math.min(contas.length, (i + 1) * POR_PAGINA)}</button>`).join('') : '';
  }
  elPaginas.onclick = (e) => {
    const b = e.target.closest('button[data-p]');
    if (!b) return;
    mostrarPagina(Number(b.dataset.p));
    window.multi.salvar({ pagina });
    if (modo1x1 || grade.classList.contains('solo')) btGrade.click(); // escolher página = voltar à grade dela
  };
  mostrarPagina(pagina);
  // Ocultar telas: à mão (botão) ou sozinho enquanto a janela está minimizada.
  let ocultoManual = false, minimizada = false, modoPainel = !!cfg.modoPainel;
  function pintarOculto() {
    const oculto = ocultoManual || minimizada || modoPainel;
    grade.classList.toggle('oculto', oculto);
    document.getElementById('oculto-aviso').classList.toggle('on', oculto && !modoPainel);
    document.getElementById('painel').classList.toggle('on', modoPainel);
    document.getElementById('bt-painel').classList.toggle('prim', modoPainel);
    document.getElementById('bt-ocultar').classList.toggle('prim', ocultoManual);
    for (const x of contas) x.avisarVisibilidade();
  }
  document.getElementById('bt-ocultar').onclick = () => { ocultoManual = !ocultoManual; pintarOculto(); };
  document.getElementById('bt-mostrar').onclick = () => { ocultoManual = false; minimizada = false; pintarOculto(); };
  window.multi.aoMinimizar?.((v) => { minimizada = v; pintarOculto(); });

  // ---------------------------------------------------------------- 📋 Painel
  // O jogo continua rodando em cada conta (login, conexão, bot, rota), mas escondido: não é
  // desenhado, que é o que pesa sem placa de vídeo. Aqui fica um cartão por conta, lido do estado
  // que o núcleo do bot já remonta (window.__pokebotCore), e os comandos vão pelo mesmo WebSocket.
  const JS_PAINEL = `(() => {
    const c = window.__pokebotCore, e = c?.eu;
    if (!e) return { logado: !!c?.logado, semTela: window.__semTela?.estado ?? null };
    const pk = e.pokemons?.find((p) => p.id === e.activeId);
    const bola = (n) => { const b = (c.catalogoBolas || []).find((x) => (x.nome ?? x.name) === n); return b ? (e.balls?.[b.id] ?? 0) : null; };
    const pocoes = [...c.itens.values()].filter((i) => i.category === 'heal').reduce((s, i) => s + (e.items?.[i.id] ?? 0), 0);
    const h = (c.hunts || []).find((x) => x.slug === e.huntSlug);
    return {
      logado: !!c.logado, nick: e.nick, nivel: e.level, gold: e.gold, diamantes: e.diamonds, gemas: e.orbs, vip: !!e.loja?.vip,
      hunt: h ? h.nome + (h.area === 'outland' ? ' · Outland ' + (e.outlandTier ?? 1) : '') : (e.huntSlug ?? '—'),
      area: h?.area ?? '', centro: !!e.noCentro,
      pk: pk ? { nome: pk.nome, nv: pk.level, hp: pk.hp, max: pk.maxHp } : null,
      ultra: bola('Ultra Ball'), pocoes, water: e.items?.[142] ?? 0, semParar: !!e.automation?.autoBallSemParar,
      rota: window.__pokeRota ? { on: window.__pokeRota.ativo, st: window.__pokeRota.status } : null,
      semTela: window.__semTela?.estado ?? null,
      drops: window.__pokeItens?.resumoDrops?.() ?? null,
      log: [...(c.memoria?.rotaLog || []).slice(0, 2), ...(c.log || []).slice(0, 2)],
    };
  })()`;
  const JS_HUNTS = `JSON.stringify((window.__pokebotCore?.hunts || []).filter((h) => h.nivel <= (window.__pokebotCore?.eu?.level ?? 0)).sort((a, b) => b.nivel - a.nivel).map((h) => [h.slug, h.nome, h.area, h.nivel]))`;
  const fmtK = (n) => (n == null ? '?' : Number(n).toLocaleString('pt-BR', { maximumFractionDigits: 0 }));
  const elPainel = document.getElementById('painel');
  const elTotal = document.createElement('div');
  elTotal.id = 'painel-total';
  elTotal.innerHTML = '<b>Drops de hoje (4 contas)</b> · <span class="rot">carregando…</span>';
  elPainel.appendChild(elTotal);
  for (const x of contas) {
    const card = document.createElement('div');
    card.className = 'pc';
    card.innerHTML = `
      <header><span class="ponto"></span><b data-p="nick">${escH(x.nome)}</b><span class="rot" data-p="conta">conta ${x.n}</span></header>
      <div data-p="linhas"><span class="rot">carregando…</span></div>
      <div class="acoes">
        <button data-pa="centro" title="Voltar ao Centro Pokémon">🏥 Centro</button>
        <select data-pa="hunt" title="Hunts liberadas para o treinador desta conta"><option value="">Ir para hunt…</option></select>
        <button data-pa="rota" title="Liga/desliga a rota automática desta conta">🧭 Rota</button>
        <button data-pa="ver" title="Mostra a tela do jogo desta conta (para login, captcha ou olhar algo)">👁 Ver tela</button>
        <button data-pa="recarregar" title="Recarregar esta conta">⟳</button>
      </div>
      <div class="log" data-p="log"></div>`;
    elPainel.appendChild(card);
    x.card = card;
    const sel = card.querySelector('[data-pa="hunt"]');
    // A lista de hunts só é montada quando o seletor é aberto (são centenas).
    sel.addEventListener('mousedown', async () => {
      if (sel.dataset.ok) return;
      const lista = JSON.parse((await naConta(x, JS_HUNTS)) || '[]');
      sel.innerHTML = '<option value="">Ir para hunt…</option>' + lista.map(([slug, nome, area, nv]) => `<option value="${escH(slug)}">${escH(nome)} · ${escH(area)} · nv ${nv}</option>`).join('');
      sel.dataset.ok = '1';
    });
    sel.onchange = async () => {
      const slug = sel.value;
      if (!slug) return;
      // Hunt escolhida à mão: desliga a rota desta conta, senão ela levaria de volta em segundos.
      await naConta(x, `window.__pokeRota?.ativo && window.__pokeRota.definirAtivo(false); window.__pokebotCore.send({ t: 'hunt.select', slug: ${JSON.stringify(slug)} })`);
      aviso(`${x.nome}: indo para ${sel.options[sel.selectedIndex].text.split(' · ')[0]} (rota desligada nesta conta)`);
      sel.value = '';
    };
    card.querySelector('.acoes').addEventListener('click', async (ev) => {
      const a = ev.target.closest('button[data-pa]')?.dataset.pa;
      if (!a) return;
      if (a === 'centro') { await naConta(x, `window.__pokebotCore.send({ t: 'centro.ir' })`); aviso(`${x.nome}: voltando ao Centro`); }
      else if (a === 'rota') { await naConta(x, 'window.__pokeRota && window.__pokeRota.definirAtivo(!window.__pokeRota.ativo)'); }
      else if (a === 'ver') {
        if (x.semTela) return aviso(`${x.nome} está sem tela — para ver o jogo dela, tire a conta do modo sem tela (me peça).`, 6000);
        definirPainel(false); usar1x1(x.n);
      }
      else if (a === 'recarregar') { if (!x.semTela) { try { x.wv.reload(); } catch {} } }
      pintarPainel();
    });
  }
  async function pintarPainel() {
    if (!modoPainel) return;
    await Promise.all(contas.map(async (x) => {
      const d = x.pronta || x.semTela ? await naConta(x, JS_PAINEL) : null;
      const q = (k) => x.card.querySelector(`[data-p="${k}"]`);
      x.card.querySelector('.ponto').className = `ponto ${d?.logado ? 'ok' : d ? 'ruim' : ''}`;
      if (!d) { q('linhas').innerHTML = `<span class="rot">${x.descarregada || x.pendente ? 'não carregada — use 👁 Ver tela' : 'carregando…'}</span>`; return; }
      if (!d.nivel) { q('linhas').innerHTML = `<span class="rot">${x.semTela ? `sem tela: ${escH(d.semTela ?? 'iniciando…')}` : 'deslogada / sem conexão — use 👁 Ver tela para entrar'}</span>`; return; }
      q('nick').textContent = d.nick ?? x.nome;
      const hp = d.pk?.max ? Math.round((d.pk.hp / d.pk.max) * 100) : null;
      q('linhas').innerHTML = [
        ...(x.semTela ? [`<span class="rot">Modo</span> 🖥️ sem tela · ${escH(d.semTela ?? '?')}`] : []),
        `<span class="rot">Treinador</span> nv <b>${fmtK(d.nivel)}</b> · 💰 ${fmtK(d.gold)} · 💠 <b>${fmtK(d.gemas)}</b> gemas · 💎 ${fmtK(d.diamantes)} diamantes${d.vip ? ' · VIP' : ''}`,
        `<span class="rot">Pokémon</span> <b>${escH(d.pk?.nome ?? '—')}</b> nv <b>${fmtK(d.pk?.nv)}</b>${hp != null ? ` · HP ${hp}%` : ''}`,
        `<span class="rot">Onde</span> ${d.centro ? '🏥 Centro Pokémon' : `🗺 ${escH(d.hunt)}`}`,
        `<span class="rot">Bolsa</span> Ultra ${fmtK(d.ultra)} · Poções ${fmtK(d.pocoes)} · Water Stone ${fmtK(d.water)} · ${d.semParar ? 'lançar sem parar ✓' : 'lançar sem parar ✗'}`,
        `<span class="rot">Rota</span> ${d.rota ? (d.rota.on ? `✓ ${escH(d.rota.st)}` : 'desligada') : '—'}`,
        ...(cfg.spotsDoDia?.porConta?.[x.n] && cfg.spotsDoDia.dia === diaLocal() ? [`<span class="rot">Spot de hoje</span> 🗺 ${escH(cfg.spotsDoDia.porConta[x.n].nome)}${cfg.spotsDoDia.porConta[x.n].xph ? ` · ~${escH(cfg.spotsDoDia.porConta[x.n].xph)} XP/h` : ''}`] : []),
        `<span class="drops"><span class="rot">Caiu hoje</span> ${d.drops?.hoje?.length ? d.drops.hoje.map((x) => `${escH(x.nome)} <b>×${fmtK(x.qtd)}</b>`).join(' · ') : '<span class="rot">nada ainda</span>'}</span>`,
        ...(d.drops?.ontem?.length ? [`<span class="rot">Ontem</span> ${d.drops.ontem.map((x) => `${escH(x.nome)} ×${fmtK(x.qtd)}`).join(' · ')}`] : []),
        ...(d.drops?.bolsa?.length ? [`<span class="rot">Na bolsa</span> ${d.drops.bolsa.map((x) => `${escH(x.nome)} ${fmtK(x.qtd)}`).join(' · ')}`] : []),
        ...(d.drops?.boss?.length ? [`<span class="rot">Boss</span> ${d.drops.boss.map((b) => `${escH(b.nome)} ${b.venceu ? '✓' : '✗'}${b.drops.length ? ` (${escH(b.drops.join(', '))})` : ''}`).join(' · ')}`] : []),
      ].join('<br>');
      x.card.querySelector('[data-pa="rota"]').classList.toggle('on', !!d.rota?.on);
      x.dropsHoje = d.drops?.hoje ?? [];
      q('log').textContent = (d.log ?? []).join('\n');
    }));
    const total = {};
    for (const x of contas) for (const it of x.dropsHoje ?? []) total[it.nome] = (total[it.nome] ?? 0) + it.qtd;
    const itens = Object.entries(total).sort((a, b) => b[1] - a[1]);
    elTotal.innerHTML = `<b>Drops de hoje (${contas.length} contas)</b> · ${itens.length ? itens.map(([n, q]) => `${escH(n)} <b>×${fmtK(q)}</b>`).join(' · ') : '<span class="rot">nada ainda</span>'}`;
  }
  function definirPainel(v) {
    modoPainel = v;
    window.multi.salvar({ modoPainel });
    pintarOculto();
    pintarPainel();
  }
  document.getElementById('bt-painel').onclick = () => definirPainel(!modoPainel);
  setInterval(pintarPainel, 3000);
  // Escolher um layout (1×1, Grade, aba de conta) sai do painel.
  for (const id of ['bt-1x1', 'bt-grade', 'abas-1x1']) document.getElementById(id).addEventListener('click', () => { if (modoPainel) definirPainel(false); });
  if (modoPainel) setTimeout(() => { pintarOculto(); pintarPainel(); }, 0); // abriu no painel
  if (modo1x1) usar1x1(cfg.conta1x1 ?? 1); else pintarLayout();
  document.getElementById('bt-pasta').onclick = () => window.multi.abrirPastaBot();

  // ---------------------------------------------------------------- pedra abaixo do mercado, em todas as contas
  // Você dá a ordem; cada conta alternativa anuncia a pedra em Coins, 5–10% abaixo do menor anúncio.
  // A conta protegida (Bekazin) é sempre pulada — a trava também existe dentro do módulo da conta.
  const reb = { info: [], nome: '', qtd: 1, desconto: '', previas: null, rodando: false, resultados: null,
    base: 'mercado', acimaMax: 8, acimaMin: 3, regras: new Map() }; // base 'rotom' = um pouco ACIMA do seu alvo de compra no Rotom
  const fmtN = (n) => Number(n ?? 0).toLocaleString('pt-BR', { maximumFractionDigits: 0 });
  const naConta = (c, js) => (c.semTela ? window.multi.semTelaExec(c.n, js) : c.wv.executeJavaScript(js)).catch(() => null);

  /**
   * Os alvos de compra do Rotom Sniper (item → preço máximo em Coins), lidos das contas. A conta
   * protegida vem primeiro: é nela que você compra, então os alvos dela valem sobre os das outras.
   */
  async function lerRegrasRotom() {
    reb.regras = new Map();
    if (!window.multi.rotomRegras) return;
    const ordem = [...reb.info].sort((a, b) => (b.i?.protegida ? 1 : 0) - (a.i?.protegida ? 1 : 0));
    for (const x of ordem) {
      const regras = await window.multi.rotomRegras(x.c.n).catch(() => null);
      for (const r of regras ?? []) {
        const alvo = Number(r.maxPriceGold) || 0;
        const nome = String(r.targetName ?? '').toLowerCase();
        if (!alvo || !nome || reb.regras.has(nome)) continue;
        const regra = { alvo, de: x.i?.nick ?? x.c.nome, ativa: r.active !== false };
        reb.regras.set(nome, regra);
        if (r.targetId != null && !reb.regras.has('#' + r.targetId)) reb.regras.set('#' + r.targetId, regra);
      }
    }
  }
  /** O alvo do Rotom para uma pedra: pelo nome ou, se a regra foi criada por id, pelo id do item. */
  function alvoRotom(nome) {
    const porNome = reb.regras.get(String(nome ?? '').toLowerCase());
    if (porNome) return porNome;
    for (const x of reb.info) for (const p of x.i?.pedras ?? []) if (p.nome === nome && reb.regras.has('#' + p.id)) return reb.regras.get('#' + p.id);
    return null;
  }

  async function lerContasReb() {
    reb.info = await Promise.all(contas.map(async (c) => ({ c, i: await naConta(c, 'window.__pokeVendas?.infoRebaixar ? window.__pokeVendas.infoRebaixar() : null') })));
  }

  function pintarReb() {
    const host = document.getElementById('reb-modal');
    const alvos = reb.info.filter((x) => x.i?.logado && !x.i.protegida);
    const pedras = new Map();
    for (const x of alvos) for (const p of x.i.pedras ?? []) {
      const r = pedras.get(p.nome) ?? { nome: p.nome, total: 0, contas: 0 };
      r.total += p.q; r.contas++;
      pedras.set(p.nome, r);
    }
    const lista = [...pedras.values()].sort((a, b) => a.nome.localeCompare(b.nome));
    if (!reb.nome || !pedras.has(reb.nome)) reb.nome = lista[0]?.nome ?? '';
    // Com alvo no Rotom para a pedra, a base padrão é ele (até você escolher a outra na mão).
    if (!reb.escolheuBase) reb.base = alvoRotom(reb.nome) ? 'rotom' : 'mercado';
    const linhaConta = (x) => {
      const nome = x.i?.nick ?? x.c.nome;
      if (!x.i) return `<tr><td>${escH(x.c.nome)}</td><td colspan="4" class="ajuda">carregando / sem o módulo</td></tr>`;
      if (!x.i.logado) return `<tr><td>${escH(x.c.nome)}</td><td colspan="4" class="ajuda">deslogada</td></tr>`;
      if (x.i.protegida) return `<tr><td><b>${escH(nome)}</b></td><td colspan="4" class="ruim">🔒 protegida — nunca anuncia</td></tr>`;
      const pv = reb.previas?.get(x.c.n);
      const res = reb.resultados?.get(x.c.n);
      const tem = (x.i.pedras ?? []).find((p) => p.nome === reb.nome)?.q ?? 0;
      return `<tr><td><b>${escH(nome)}</b></td><td>${tem ? fmtN(tem) : '<span class="ajuda">não tem</span>'}</td>
        <td>${pv ? (pv.erro ? `<span class="ruim">${escH(pv.erro)}</span>` : pv.preco ? (pv.alvo ? `alvo <b>${fmtN(pv.alvo)}</b> <span class="ajuda">· menor anúncio ${pv.menor ? fmtN(pv.menor) : '—'}</span>` : `${fmtN(pv.ref)} <span class="ajuda">(${escH(pv.fonte)}, ${fmtN(pv.anuncios)} anúncios)</span>`) : '—') : '—'}</td>
        <td>${pv?.preco ? `<b>${fmtN(pv.preco)}</b> <span class="ajuda">${pv.desconto < 0 ? '+' : '−'}${Math.round(Math.abs(pv.desconto) * 1000) / 10}%${pv.alvo ? ' do alvo' : ''}</span>` : '—'}</td>
        <td>${res ? (res.ok ? `<span class="ok">✅ ${res.qtd}× por ${fmtN(res.preco)}</span>` : `<span class="ruim">${escH(res.msg)}</span>`) : ''}</td></tr>`;
    };
    const prontas = reb.previas ? alvos.filter((x) => reb.previas.get(x.c.n)?.preco) : [];
    host.innerHTML = `
      <header><span>📉 Pedra abaixo do mercado — todas as contas alternativas</span><button data-reb="fechar">×</button></header>
      <section>
        ${lista.length ? `<div class="linha">
          Pedra <select data-reb-c="nome">${lista.map((p) => `<option ${p.nome === reb.nome ? 'selected' : ''}>${escH(p.nome)}</option>`).join('')}</select>
          <span class="ajuda">${(() => { const p = pedras.get(reb.nome); return p ? `${fmtN(p.total)} no total, em ${p.contas} conta(s)` : ''; })()}</span>
        </div>
        <div class="linha">
          Base do preço
          <button data-reb="base" data-v="mercado" class="${reb.base === 'mercado' ? 'on' : ''}">menor anúncio (abaixo dele)</button>
          <button data-reb="base" data-v="rotom" class="${reb.base === 'rotom' ? 'on' : ''}">🎯 alvo do Rotom (um pouco acima)</button>
          <span class="ajuda">${(() => { const a = alvoRotom(reb.nome); return a ? `seu alvo no Rotom para ${escH(reb.nome)}: <b>${fmtN(a.alvo)}</b> Coins (regra da ${escH(a.de)}${a.ativa ? '' : ', pausada'})` : `sem alvo no Rotom para ${escH(reb.nome)}`; })()}</span>
        </div>
        <div class="linha">
          Quantidade por conta ${[1, 2].map((n) => `<button data-reb="qtd" data-v="${n}" class="${reb.qtd === n ? 'on' : ''}">${n}</button>`).join('')}
          ${reb.base === 'rotom'
            ? `· acima do alvo: de <input data-reb-c="acimaMax" type="number" min="0" max="50" step="0.5" value="${escH(reb.acimaMax)}"> % até <input data-reb-c="acimaMin" type="number" min="0" max="50" step="0.5" value="${escH(reb.acimaMin)}"> % <span class="ajuda">(1ª conta mais alta, a última mais perto do alvo)</span>`
            : `· desconto <input data-reb-c="desconto" type="number" min="5" max="10" step="0.5" placeholder="auto" value="${escH(reb.desconto)}"> % <span class="ajuda">(desconto da 1ª conta; vazio = 5%; cada conta seguinte fica abaixo da anterior)</span>`}
        </div>
        <div class="linha">
          <button data-reb="previa" ${reb.rodando ? 'disabled' : ''}>🔎 Ver preços em cada conta</button>
          <button data-reb="publicar" class="on" ${reb.rodando || !prontas.length ? 'disabled' : ''}>📢 Publicar em ${prontas.length} conta(s)</button>
          ${reb.rodando ? `<span class="ajuda">${escH(reb.rodando)}</span>` : ''}
        </div>` : '<p class="ajuda">Nenhuma pedra nas contas alternativas logadas.</p>'}
        <p class="ajuda">${reb.base === 'rotom'
          ? 'Em COINS. Base: seu alvo de compra no Rotom Sniper (regras da conta protegida valem primeiro). Cada conta anuncia um pouco ACIMA do alvo — a 1ª mais alta, descendo até a última, sempre uma abaixo da outra —, para quem vende ancorar no seu alvo.'
          : `Em COINS. Preços ESCALONADOS: cada conta um degrau abaixo da anterior (de 5% até 10%; se começar em 10% ou mais, cada uma desce 2,5% a mais), todas sobre o mesmo menor anúncio lido no "Ver preços" — antes de qualquer publicação.`}</p>
      </section>
      <section>
        <table><tr><th>Conta</th><th>Tem</th><th>Referência</th><th>Vai anunciar por (cada)</th><th>Resultado</th></tr>
          ${reb.info.map(linhaConta).join('')}</table>
      </section>`;
  }

  async function abrirReb() {
    reb.previas = null; reb.resultados = null;
    document.getElementById('reb-fundo').classList.add('aberto');
    document.getElementById('reb-modal').innerHTML = '<p style="padding:14px">Lendo as contas e os alvos do Rotom…</p>';
    await lerContasReb();
    await lerRegrasRotom();
    pintarReb();
  }

  async function previaReb() {
    reb.rodando = 'lendo os preços…'; reb.resultados = null; pintarReb();
    reb.previas = new Map();
    const alvos = reb.info.filter((x) => x.i?.logado && !x.i.protegida);
    const arg = JSON.stringify({ nome: reb.nome, desconto: reb.desconto === '' ? null : Number(reb.desconto) });
    await Promise.all(alvos.map(async (x) => {
      reb.previas.set(x.c.n, (await naConta(x.c, `window.__pokeVendas.previaRebaixar(${arg})`)) ?? { erro: 'sem resposta' });
    }));
    // Escalonado: cada conta um degrau abaixo da anterior, do desconto inicial (o escolhido, ou 5%)
    // até 10%, todas sobre a MESMA referência — o menor preço lido antes de qualquer publicação.
    const comPreco = alvos.filter((x) => reb.previas.get(x.c.n)?.preco);
    const alvoR = reb.base === 'rotom' ? alvoRotom(reb.nome) : null;
    if (reb.base === 'rotom') {
      if (!alvoR) {
        for (const x of comPreco) reb.previas.set(x.c.n, { ...reb.previas.get(x.c.n), preco: null, erro: 'sem alvo no Rotom para esta pedra' });
        reb.rodando = false;
        return pintarReb();
      }
      // Um pouco ACIMA do alvo, escalonado: a 1ª conta mais alta, a última mais perto do alvo.
      // (Aqui basta a conta ter a pedra; não precisa haver anúncio no mercado.)
      const comPedra = alvos.filter((x) => reb.previas.get(x.c.n)?.itemId);
      const aMax = Math.max(0, Number(reb.acimaMax) || 0) / 100, aMin = Math.max(0, Number(reb.acimaMin) || 0) / 100;
      let anterior = Infinity;
      comPedra.forEach((x, i) => {
        const a = comPedra.length > 1 ? aMax + (aMin - aMax) * (i / (comPedra.length - 1)) : aMax;
        const pv = reb.previas.get(x.c.n);
        delete pv.erro;
        const menor = pv.fonte === 'menor anúncio' ? pv.ref : null;
        const preco = Math.max(2, Math.min(anterior - 1, Math.ceil(alvoR.alvo * (1 + a)))); // sempre abaixo da conta anterior
        anterior = preco;
        reb.previas.set(x.c.n, { ...pv, menor, alvo: alvoR.alvo, ref: alvoR.alvo, desconto: 1 - preco / alvoR.alvo, preco }); // negativo = acima do alvo
      });
      reb.rodando = false;
      return pintarReb();
    }
    const ref = Math.min(...comPreco.map((x) => reb.previas.get(x.c.n).ref));
    const d0 = reb.desconto === '' ? 0.05 : Math.max(0.01, Number(reb.desconto) / 100);
    // Degrau: distribui até 10%; se não houver espaço (ex.: começou em 10%), cada uma desce 2,5% a
    // mais — a conta seguinte fica SEMPRE abaixo da anterior.
    const passo = comPreco.length > 1 ? Math.max(0.025, (0.10 - d0) / (comPreco.length - 1)) : 0;
    comPreco.forEach((x, i) => {
      const d = d0 + passo * i;
      const pv = reb.previas.get(x.c.n);
      reb.previas.set(x.c.n, { ...pv, ref, desconto: d, preco: Math.max(2, Math.floor(ref * (1 - d))) });
    });
    reb.rodando = false;
    pintarReb();
  }

  async function publicarReb() {
    const alvos = reb.info.filter((x) => x.i?.logado && !x.i.protegida && reb.previas?.get(x.c.n)?.preco);
    if (!alvos.length) return;
    const linhas = alvos.map((x) => { const pv = reb.previas.get(x.c.n); return `${x.i.nick}: ${Math.min(pv.tem, reb.qtd)}× por ${fmtN(pv.preco)} Coins`; }).join('\n');
    const baseTxt = reb.base === 'rotom' ? `Base: um pouco acima do seu alvo no Rotom (${fmtN(alvoRotom(reb.nome)?.alvo)}).` : 'Base: abaixo do menor anúncio.';
    if (!confirm(`Publicar ${reb.nome} em ${alvos.length} conta(s)?\n\n${linhas}\n\n${baseTxt}\nMoeda: COINS. A conta protegida não entra.`)) return;
    reb.resultados = new Map();
    reb.rodando = 'publicando…'; pintarReb();
    for (const x of alvos) {
      const pv = reb.previas.get(x.c.n);
      const arg = JSON.stringify({ nome: reb.nome, qtd: reb.qtd, preco: pv.preco, itemId: pv.itemId, ref: pv.ref, desconto: Math.round(pv.desconto * 100) });
      reb.resultados.set(x.c.n, (await naConta(x.c, `window.__pokeVendas.rebaixarAgora(${arg})`)) ?? { ok: false, msg: 'sem resposta' });
      pintarReb();
    }
    reb.rodando = false;
    await lerContasReb(); // quantidades novas
    pintarReb();
    const ok = [...reb.resultados.values()].filter((r) => r.ok).length;
    aviso(`📉 ${reb.nome}: anunciado em ${ok} de ${alvos.length} conta(s)`);
  }

  document.getElementById('bt-rebaixar').onclick = abrirReb;
  // ---------------------------------------------------------------- Guia: onde caçar e ranking de XP
  const gxFundo = document.getElementById('gx-fundo');
  const gxModal = document.getElementById('gx-modal');
  const gx = { conta: null, area: '', ordem: 'xp', min: '5', r: null, carregando: false, ficha: null };
  const fmtGrande = (n) => { const a = Math.abs(n); return a >= 1e9 ? `${(n / 1e9).toFixed(2)} bi` : a >= 1e6 ? `${(n / 1e6).toFixed(1)} mi` : fmtN(n); };
  const JS_FICHA_ATIVO = `(() => { const e = window.__pokebotCore?.eu; if (!e) return null;
    const p = (e.pokemons ?? []).find((x) => x.id === e.activeId); if (!p) return null;
    return { nome: p.nome, nivel: p.level, q: Number(p.quality) || 1, pot: Number(p.potencia) || 1, shiny: !!p.shiny, ivs: p.ivs ?? {}, refino: p.refino ?? {},
      tm: !!p.tmElemental, aoe: !!(p.tmAoe || p.tmArea), vip: !!e.loja?.vip, treinador: e.nick }; })()`;

  async function gxHunts(c) {
    gx.conta = c; gx.carregando = true; gx.r = null;
    gxFundo.classList.add('aberto');
    gxPintarHunts();
    gx.ficha = await naConta(c, JS_FICHA_ATIVO);
    if (!gx.ficha) { gx.carregando = false; gx.r = { erro: 'não achei o pokémon ativo — a conta está logada?' }; return gxPintarHunts(); }
    gx.r = await window.multi.guiaHunts({ ...gx.ficha, area: gx.area, ordem: gx.ordem, min: gx.min });
    gx.carregando = false;
    gxPintarHunts();
  }
  function gxPintarHunts() {
    const f = gx.ficha, r = gx.r;
    const opt = (lista, v) => lista.map(([k, t]) => `<option value="${k}" ${String(v) === k ? 'selected' : ''}>${t}</option>`).join('');
    gxModal.innerHTML = `<header><span>🗺 Onde caçar — ${escH(gx.conta?.nome ?? '')}${f ? ` · ${escH(f.nome)} Nv ${fmtN(f.nivel)}` : ''}</span><button data-gx="fechar">×</button></header>
      <section><div class="linha">
        <select data-gxc="area">${opt([['', 'Todas as regiões'], ['kanto', 'Kanto'], ['johto', 'Johto'], ['outland', 'Outland'], ['hoenn', 'Hoenn (500–850)'], ['sinnoh', 'Sinnoh (1000–3500)'], ['unova', 'Unova (5000–8600)'], ['kalos', 'Kalos (10k–21k)'], ['alola', 'Alola (25k–160k)']], gx.area)}</select>
        <select data-gxc="ordem">${opt([['xp', 'Ordenar: XP/h'], ['ouro', 'Ordenar: dinheiro/h'], ['nivel', 'Ordenar: nível']], gx.ordem)}</select>
        <select data-gxc="min">${opt([['5', 'Mínimo: segura'], ['1', 'Mínimo: apertada'], ['0.5', 'Mínimo: arriscada']], gx.min)}</select>
        <button data-gx="recalc" ${gx.carregando ? 'disabled' : ''}>${gx.carregando ? 'calculando no guia…' : '⟳ recalcular'}</button>
        <span class="ajuda">${f ? `P${f.pot} · Q ${f.q.toFixed(3).replace('.', ',')}${f.shiny ? ' · ✨' : ''} · IVs ${['hp', 'atk', 'def', 'spAtk', 'spDef', 'speed'].map((k) => f.ivs[k] ?? '?').join('/')}${f.tm ? ' · TM elemental' : ''}${f.vip ? ' · VIP' : ''}` : ''}</span>
      </div>
      ${r?.veredito ? `<div class="ajuda">⚖ ${escH(r.veredito)}</div>` : ''}</section>
      <section>${!r ? '<span class="ajuda">Abrindo o guia e calculando…</span>'
        : r.erro ? `<span class="ruim">${escH(r.erro)}</span>`
        : r.linhas?.length ? `<table><tr>${r.cab.map((h) => `<th>${escH(h)}</th>`).join('')}</tr>${r.linhas.map((l) => `<tr>${l.map((c) => `<td>${escH(c)}</td>`).join('')}</tr>`).join('')}</table>`
        : '<span class="ajuda">O guia não devolveu hunts para esse pokémon (filtro muito restrito?).</span>'}
        <p class="ajuda">Cálculo do <b>guiapokeidlehardtocapture.site</b> (aba "Onde caçar"), com a ficha do pokémon ATIVO desta conta: espécie, nível, potência, qualidade, shiny, IVs, refino, TM e VIP. ${r?.coleta ? escH(r.coleta) : ''}</p></section>`;
  }

  async function gxRanking() {
    gxFundo.classList.add('aberto');
    gxModal.innerHTML = '<header><span>🏆 Ranking de XP do dia</span><button data-gx="fechar">×</button></header><section><span class="ajuda">Lendo o ranking do guia…</span></section>';
    const nicks = (await Promise.all(contas.map((c) => naConta(c, 'window.__pokebotCore?.eu?.nick ?? null')))).filter(Boolean);

    const foraTop = r.meus.filter((m) => m.pos > 10);
    gxModal.innerHTML = `<header><span>🏆 Ranking de XP do dia — ${r.dia.slice(8, 10)}/${r.dia.slice(5, 7)}</span><button data-gx="fechar">×</button></header>
      <section><div class="linha">${r.meus.map((m) => `<b>${escH(m.nick)}</b>: <span class="ok">#${m.pos}</span> de ${fmtN(r.jogadores)} (+${fmtGrande(m.ganho)} XP)`).join(' · ') || '<span class="ajuda">Suas contas não aparecem no ranking de hoje.</span>'}</div>
        <span class="ajuda">XP ganho de ${r.diaAnt.slice(8, 10)}/${r.diaAnt.slice(5, 7)} para ${r.dia.slice(8, 10)}/${r.dia.slice(5, 7)} · dados do guia (coleta 2× ao dia${r.geradoEm ? `, última ${new Date(r.geradoEm).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}` : ''})</span></section>
      <section><table><tr><th>Pos.</th><th>Jogador</th><th>XP do dia</th><th>XP total</th></tr>${r.top.map(linha).join('')}
        ${foraTop.length ? `<tr><td colspan="4" class="ajuda">…</td></tr>${foraTop.map(linha).join('')}` : ''}</table></section>
      ${Object.keys(r.historico).length ? `<section><b>Sua posição por dia</b><table><tr><th>Jogador</th>${(Object.values(r.historico)[0] ?? []).map((h) => `<th>${h.dia.slice(8, 10)}/${h.dia.slice(5, 7)}</th>`).join('')}</tr>
        ${Object.entries(r.historico).map(([n, hs]) => `<tr><td>${escH(n)}</td>${hs.map((h) => `<td>#${h.pos}<span class="ajuda"> +${fmtGrande(h.ganho)}</span></td>`).join('')}</tr>`).join('')}</table></section>` : ''}`;
  }

  // ---------------------------------------------------------------- agente de IA: configuração
  let iaUltimoMsg = '';

  // ---------------------------------------------------------------- 🗺 Spot do dia na Outland
  // Uma vez por dia: para cada conta, o guia (aba "Onde caçar", com a ficha do pokémon ativo) lista
  // as hunts da Outland por XP/h, só as seguras. Cada conta pega uma posição diferente dessa lista,
  // e a posição anda um passo por dia — spots diferentes entre as contas, e um spot novo por dia.
  // O resultado vai para a 🧭 Rota de cada conta (window.__pokeRota.definirSpotDoDia).
  const SPOT_TOP = 8; // quantos dos melhores entram no rodízio
  const diaLocal = (ms = Date.now()) => { const d = new Date(ms); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
  const numeroDoDia = () => Math.floor((Date.now() - new Date().getTimezoneOffset() * 60_000) / 86_400_000);
  const nomeDoGuia = (t) => { const s = String(t ?? '').trim(); const h = s.length / 2; return Number.isInteger(h) && s.slice(0, h) === s.slice(h) ? s.slice(0, h) : s; };
  const JS_HUNTS_OUTLAND = `JSON.stringify((window.__pokebotCore?.hunts || []).filter((h) => h.area === 'outland').map((h) => [h.slug, h.nome]))`;
  let spotsRodando = false;
  async function escolherSpotsDoDia(forcar = false) {
    if (spotsRodando) return;
    const hoje = diaLocal();
    const salvo = cfg.spotsDoDia;
    if (!forcar && salvo?.dia === hoje) {
      // Já escolhido hoje: só reenvia (a conta pode ter reiniciado).
      for (const x of contas) { const sp = salvo.porConta?.[x.n]; if (sp) await naConta(x, `window.__pokeRota?.definirSpotDoDia(${JSON.stringify(sp)})`); }
      return;
    }
    spotsRodando = true;
    try {
      const listas = new Map(); // n → [{ slug, nome, xph }]
      for (const x of contas) {
        const ficha = await naConta(x, JS_FICHA_ATIVO);
        const treinador = await naConta(x, 'window.__pokebotCore?.eu?.level ?? 0');
        if (!ficha || treinador < 150) continue; // Outland libera com treinador nv 150
        const r = await window.multi.guiaHunts({ ...ficha, area: 'outland', ordem: 'xp', min: '5' });
        const mapa = new Map(JSON.parse((await naConta(x, JS_HUNTS_OUTLAND)) || '[]').map(([slug, nome]) => [nome.toLowerCase(), slug]));
        const cab = r?.cab ?? [];
        const iXp = cab.findIndex((h) => /XP\/h/i.test(h));
        const lista = (r?.linhas ?? []).map((l) => ({ nome: nomeDoGuia(l[0]), xph: iXp >= 0 ? String(l[iXp]).match(/[\d.,]+\s*[kMB]?/)?.[0] ?? '' : '' }))
          .map((h) => ({ ...h, slug: mapa.get(h.nome.toLowerCase()) })).filter((h) => h.slug).slice(0, SPOT_TOP);
        if (lista.length) listas.set(x.n, lista);
      }
      const usados = new Set();
      const porConta = {};
      const d = numeroDoDia();
      contas.forEach((x, i) => {
        const lista = listas.get(x.n);
        if (!lista) return;
        for (let k = 0; k < lista.length; k++) {
          const sp = lista[(d + i + k) % lista.length];
          if (usados.has(sp.slug) && k < lista.length - 1) continue; // outra conta já está nele hoje
          usados.add(sp.slug);
          porConta[x.n] = { dia: hoje, slug: sp.slug, nome: sp.nome, xph: sp.xph };
          break;
        }
      });
      cfg.spotsDoDia = { dia: hoje, porConta };
      window.multi.salvar({ spotsDoDia: cfg.spotsDoDia });
      for (const x of contas) { const sp = porConta[x.n]; if (sp) await naConta(x, `window.__pokeRota?.definirSpotDoDia(${JSON.stringify(sp)})`); }
      const resumo = contas.filter((x) => porConta[x.n]).map((x) => `${x.nome}: ${porConta[x.n].nome}`).join(' · ');
      if (resumo) aviso(`🗺 Spots de hoje na Outland — ${resumo}`, 9000);

    else if (a === 'qtd') { reb.qtd = Number(b.dataset.v); pintarReb(); }
    else if (a === 'base') { reb.base = b.dataset.v; reb.escolheuBase = true; reb.previas = null; reb.resultados = null; pintarReb(); }
    else if (a === 'previa') previaReb();
    else if (a === 'publicar') publicarReb();
  });
  document.getElementById('reb-fundo').addEventListener('change', (e) => {
    const c = e.target.dataset.rebC;
    if (!c) return;
    reb[c] = e.target.value;
    reb.previas = null; reb.resultados = null;
    pintarReb();
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') focar(null); });

  // Atualização ao vivo: lógica nova entra nas 4 contas sem recarregar nada.
  window.multi.aoMudarLogica((codigo) => {
    logica = codigo;
    versaoLogica = lerVersao(codigo);
    atualizarInfo();
    for (const c of contas) injetarLogica(c);
    aviso(`🤖 Bot atualizado nas ${contas.length} contas — lógica v${versaoLogica}`);
  });
  window.multi.aoMudarCore(() => {
    for (const c of contas) c.wv.executeJavaScript("window.postMessage({ pokebot: 'core-mudou' }, location.origin)").catch(() => {});
    aviso('🤖 Núcleo do bot atualizado — recarregue cada conta (⟳) quando ela estiver no Centro Pokémon.', 8000);
  });
})();
</script>
</body>
</html>
