<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
<title>PokeIdle Multi</title>
<style>
  :root{--fundo:#1d1010;--barra:#3a2020;--borda:#e2915a;--texto:#f6e7d4;--roxo:#b04ad0;--ouro:#f3c77a}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--fundo);color:var(--texto);font:13px system-ui,sans-serif;overflow:hidden}
  #topo{height:38px;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--barra);border-bottom:2px solid var(--borda)}
  #topo b{color:var(--ouro);letter-spacing:.5px;margin-right:8px}
  #topo .esp{flex:1}
  #topo .info{opacity:.75;font-size:12px}
  button{background:#5a3232;border:1px solid #8a5a4a;color:var(--texto);border-radius:6px;padding:4px 9px;cursor:pointer;font:inherit}
  button:hover{background:#6e3d3d}
  button.prim{background:var(--roxo);border-color:var(--ouro);color:#fff}
  #grade{position:absolute;top:38px;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:4px;padding:4px}
  #grade.solo{grid-template-columns:1fr;grid-template-rows:1fr}
  #grade.solo .conta:not(.foco){display:none}
  .conta{position:relative;display:flex;flex-direction:column;border:2px solid #5a3232;border-radius:8px;overflow:hidden;background:#000;min-width:0;min-height:0}
  .conta.foco{border-color:var(--borda)}
  .cab{height:28px;flex:none;display:flex;align-items:center;gap:6px;padding:0 6px;background:var(--barra)}
  .cab .num{background:var(--roxo);color:#fff;border-radius:5px;padding:1px 7px;font-weight:800}
  .cab input.nome{background:transparent;border:1px solid transparent;color:var(--texto);font:600 13px system-ui;width:140px;border-radius:5px;padding:2px 4px}
  .cab input.nome:hover,.cab input.nome:focus{border-color:#8a5a4a;outline:none;background:#2a1515}
  .cab .esp{flex:1}
  .cab .zoom{min-width:38px;text-align:center;opacity:.8;font-size:12px}
  .cab button{padding:1px 7px;font-size:12px}
  .cab button.eco.on{background:#2f6b3a;border-color:#7fdc8f}
  .cab .estado{width:9px;height:9px;border-radius:50%;background:#888}
  .cab .estado.ok{background:#6f6;box-shadow:0 0 5px #6f6}
  .cab .estado.carregando{background:#fc6}
  webview{flex:1;width:100%;min-height:0}
  #reb-fundo{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center}
  #reb-fundo.aberto{display:flex}
  #reb-modal{width:min(820px,95vw);max-height:90vh;overflow:auto;background:#3a2020;border:3px solid var(--borda);border-radius:14px;padding:0 0 12px}
  #reb-modal header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#c9754a;color:#2a1212;font-weight:800}
  #reb-modal section{padding:10px 14px;border-bottom:1px solid #5a3232}
  #reb-modal .linha{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
  #reb-modal select,#reb-modal input{background:#2a1515;border:1px solid #8a5a4a;color:var(--texto);border-radius:6px;padding:4px 8px;font:inherit}
  #reb-modal input{width:64px}
  #reb-modal table{width:100%;border-collapse:collapse;font-size:12px}
  #reb-modal th{text-align:left;color:var(--ouro);padding:4px 6px}
  #reb-modal td{padding:5px 6px;border-top:1px solid #4a2a2a}
  #reb-modal .ok{color:#7fdc8f;font-weight:700}#reb-modal .ruim{color:#ff8a8a;font-weight:700}#reb-modal .ajuda{opacity:.7;font-size:12px}
  #reb-modal button.on{background:var(--roxo);border-color:var(--ouro);color:#fff}
  #aviso{position:fixed;left:50%;top:48px;transform:translateX(-50%);z-index:10;background:#2a1515;border:2px solid var(--ouro);border-radius:10px;padding:8px 14px;font-weight:600;display:none}
</style>
</head>
<body>
<div id="topo">
  <b>🤖 PokeIdle Multi</b>
  <button id="bt-grade" class="prim" title="Mostrar as 4 contas">Grade 2×2</button>
  <span class="esp"></span>
  <span class="info" id="info-bot">bot: carregando…</span>
  <button id="bt-rebaixar" title="Anunciar uma pedra abaixo do mercado em todas as contas alternativas, de uma vez">📉 Pedra abaixo do mercado</button>
  <button id="bt-pasta" title="Abre a pasta onde ficam core.js e logica.js">Pasta do bot</button>
</div>
<div id="grade"></div>
<div id="aviso"></div>
<div id="reb-fundo"><div id="reb-modal"></div></div>

<script>
(async () => {
  const cfg = await window.multi.cfg();
  const grade = document.getElementById('grade');
  const contas = [];
  let logica = await window.multi.logica();
  let versaoLogica = '?';
  const salvar = () => window.multi.salvar({ contas: contas.map((c) => ({ nome: c.nome, zoom: c.zoom, mudo: c.mudo })) });

  function aviso(txt, ms = 4000) {
    const el = document.getElementById('aviso');
    el.textContent = txt;
    el.style.display = 'block';
    clearTimeout(aviso.t);
    aviso.t = setTimeout(() => (el.style.display = 'none'), ms);
  }

  function lerVersao(codigo) {
    const m = /VERSAO_LOGICA\s*=\s*'([^']+)'/.exec(codigo);
    return m ? m[1] : '?';
  }
  function atualizarInfo() {
    document.getElementById('info-bot').textContent = `bot: lógica v${versaoLogica} · atualiza sozinho ao salvar a pasta do bot`;
  }
  versaoLogica = lerVersao(logica);
  atualizarInfo();

  // Modo Economia do jogo. Usa os próprios controles dele: ligar = abrir Configurações e clicar
  // no interruptor (o jogo fecha o modal sozinho ao ligar); desligar = o botão "Ligar a cena".
  // O estado é a classe `modo-economia` no <html>, a mesma que o jogo usa.
  const JS_ECO_ESTADO = "document.documentElement.classList.contains('modo-economia')";
  const JS_ECO_ALTERNAR = `(() => {
    const ligado = () => document.documentElement.classList.contains('modo-economia');
    if (ligado()) { document.getElementById('eco-sair')?.click(); return ligado(); }
    document.getElementById('btn-config')?.click();
    const sw = document.getElementById('cfg-economia');
    if (sw) sw.click();
    else document.getElementById('modal-fechar')?.click();
    return ligado();
  })()`;

  async function injetarLogica(c) {
    try { await c.wv.executeJavaScript(logica); }
    catch (e) { console.warn('lógica não entrou na conta', c.n, e); }
  }

  for (let n = 1; n <= cfg.nContas; n++) {
    const salvo = cfg.contas?.[n - 1] ?? {};
    const c = { n, nome: salvo.nome ?? `Conta ${n}`, zoom: salvo.zoom ?? 0.6, mudo: salvo.mudo ?? (n !== 1) };

    const caixa = document.createElement('div');
    caixa.className = 'conta';
    caixa.innerHTML = `
      <div class="cab">
        <span class="num">${n}</span>
        <span class="estado carregando" title="conexão"></span>
        <input class="nome" value="${c.nome.replace(/"/g, '&quot;')}" spellcheck="false" title="Clique para renomear">
        <span class="esp"></span>
        <button data-a="shiny" class="eco" title="Caçador de shiny: registra os bichos do mapa e arremessa Great Ball quando um shiny cai">✨ Shiny</button>
        <button data-a="itens" title="Itens principais (Boss Token, peças de TM, fragmentos) e histórico de drops por boss">📦 Itens</button>
        <button data-a="vendas" title="Relatório de compras e vendas no Mercado: preço médio, taxa, lucro e preço de venda">💰 Vendas</button>
        <button data-a="pvp" class="eco" title="PvP: ordem que cada rival usou e trava da fila automática">⚔ PvP</button>
        <button data-a="time" title="Análise do time para PvP: quem colocar no lugar de quem">📊 Time</button>
        <button data-a="eco" class="eco" title="Ligar/desligar o Modo Economia do jogo nesta conta">🍃 Eco</button>
        ${cfg.rotom ? '<button data-a="rotom" title="Abrir o Cockpit do Rotom Sniper desta conta">🎯 Rotom</button>' : ''}
        <button data-a="menos" title="Diminuir zoom">−</button>
        <span class="zoom"></span>
        <button data-a="mais" title="Aumentar zoom">+</button>
        <button data-a="som" title="Som desta conta"></button>
        <button data-a="foco" title="Expandir / voltar à grade">⛶</button>
        <button data-a="recarregar" title="Recarregar esta conta">⟳</button>
        <button data-a="sair" title="Deslogar esta conta">Sair</button>
      </div>`;
    const wv = document.createElement('webview');
    wv.setAttribute('partition', `persist:conta${n}`);
    wv.setAttribute('src', cfg.urlJogo);
    wv.setAttribute('allowpopups', '');
    wv.setAttribute('webpreferences', 'backgroundThrottling=no');
    caixa.appendChild(wv);
    grade.appendChild(caixa);
    Object.assign(c, { caixa, wv });
    contas.push(c);

    const elZoom = caixa.querySelector('.zoom');
    const elSom = caixa.querySelector('[data-a="som"]');
    const elEstado = caixa.querySelector('.estado');
    const pintar = () => {
      elZoom.textContent = `${Math.round(c.zoom * 100)}%`;
      elSom.textContent = c.mudo ? '🔇' : '🔊';
    };
    const elEco = caixa.querySelector('[data-a="eco"]');
    const pintarEco = (ligado) => {
      elEco.classList.toggle('on', ligado);
      elEco.textContent = ligado ? '🍃 Eco ON' : '🍃 Eco';
    };
    const elShiny = caixa.querySelector('[data-a="shiny"]');
    const lerShiny = () => wv.executeJavaScript('!!window.__pokeShiny?.ativo')
      .then((on) => { elShiny.classList.toggle('on', on); elShiny.textContent = on ? '✨ Shiny ON' : '✨ Shiny'; })
      .catch(() => {});
    const elPvp = caixa.querySelector('[data-a="pvp"]');
    const lerPvp = () => wv.executeJavaScript('!!window.__pokePvp?.trava')
      .then((on) => { elPvp.classList.toggle('on', on); elPvp.title = on ? 'PvP: trava da fila automática ligada' : 'PvP: ordem que cada rival usou e trava da fila automática'; })
      .catch(() => {});
    const lerEco = () => { lerShiny(); lerPvp(); return wv.executeJavaScript(JS_ECO_ESTADO).then(pintarEco).catch(() => {}); };
    // O modo também pode ser trocado pelo próprio jogo — o botão acompanha.
    setInterval(lerEco, 3000);
    pintar();

    wv.addEventListener('dom-ready', () => {
      wv.setZoomFactor(c.zoom);
      wv.setAudioMuted(c.mudo);
      injetarLogica(c);
    });
    wv.addEventListener('did-start-loading', () => (elEstado.className = 'estado carregando'));
    wv.addEventListener('did-stop-loading', () => (elEstado.className = 'estado ok'));
    wv.addEventListener('did-fail-load', (e) => { if (e.errorCode !== -3) elEstado.className = 'estado'; });

    caixa.querySelector('.nome').onchange = (e) => { c.nome = e.target.value.trim() || `Conta ${n}`; salvar(); };
    caixa.querySelector('.cab').onclick = (e) => {
      const a = e.target.closest('button')?.dataset.a;
      if (!a) return;
      if (a === 'mais' || a === 'menos') {
        c.zoom = Math.min(1.5, Math.max(0.3, +(c.zoom + (a === 'mais' ? 0.05 : -0.05)).toFixed(2)));
        wv.setZoomFactor(c.zoom); pintar(); salvar();
      } else if (a === 'shiny') {
        wv.executeJavaScript('window.__pokeShiny?.abrir()').catch(() => aviso('Shiny: a conta ainda está carregando.'));
      } else if (a === 'itens') {
        wv.executeJavaScript('window.__pokeItens?.abrir()').catch(() => aviso('Itens: a conta ainda está carregando.'));
      } else if (a === 'vendas') {
        wv.executeJavaScript('window.__pokeVendas?.abrir()').catch(() => aviso('Vendas: a conta ainda está carregando.'));
      } else if (a === 'pvp') {
        wv.executeJavaScript('window.__pokePvp?.abrir()').catch(() => aviso('PvP: a conta ainda está carregando.'));
      } else if (a === 'time') {
        wv.executeJavaScript('window.__pokeAnalise?.abrir()').catch(() => aviso('Análise: a conta ainda está carregando.'));
      } else if (a === 'eco') {
        wv.executeJavaScript(JS_ECO_ALTERNAR).then(pintarEco).catch(() => aviso('Modo Economia: a conta ainda está carregando.'));
      } else if (a === 'rotom') {
        window.multi.abrirCockpit(n);
      } else if (a === 'som') {
        c.mudo = !c.mudo; wv.setAudioMuted(c.mudo); pintar(); salvar();
      } else if (a === 'foco') {
        focar(grade.classList.contains('solo') && caixa.classList.contains('foco') ? null : c);
      } else if (a === 'recarregar') {
        // Sem confirmação aqui: se a conta estiver em risco (hunt, boss, Arena), o próprio jogo
        // segura a saída e o app pergunta (ver 'will-prevent-unload' no main.js).
        wv.reload();
      } else if (a === 'sair') {
        if (confirm(`Deslogar "${c.nome}"? Os dados de login desta conta neste app serão apagados.`)) {
          window.multi.sairDaConta(n).then(() => wv.loadURL(cfg.urlJogo));
        }
      }
    };
  }

  function focar(c) {
    for (const x of contas) x.caixa.classList.toggle('foco', x === c);
    grade.classList.toggle('solo', !!c);
    if (c) c.wv.setZoomFactor(Math.min(1, c.zoom * 1.6));
    else for (const x of contas) x.wv.setZoomFactor(x.zoom);
  }
  document.getElementById('bt-grade').onclick = () => focar(null);
  document.getElementById('bt-pasta').onclick = () => window.multi.abrirPastaBot();

  // ---------------------------------------------------------------- pedra abaixo do mercado, em todas as contas
  // Você dá a ordem; cada conta alternativa anuncia a pedra em Coins, 5–10% abaixo do menor anúncio.
  // A conta protegida (Bekazin) é sempre pulada — a trava também existe dentro do módulo da conta.
  const reb = { info: [], nome: '', qtd: 1, desconto: '', previas: null, rodando: false, resultados: null };
  const escH = (x) => String(x ?? '').replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
  const fmtN = (n) => Number(n ?? 0).toLocaleString('pt-BR', { maximumFractionDigits: 0 });
  const naConta = (c, js) => c.wv.executeJavaScript(js).catch(() => null);

  async function lerContasReb() {
    reb.info = await Promise.all(contas.map(async (c) => ({ c, i: await naConta(c, 'window.__pokeVendas?.infoRebaixar ? window.__pokeVendas.infoRebaixar() : null') })));
  }

  function pintarReb() {
    const host = document.getElementById('reb-modal');
    const alvos = reb.info.filter((x) => x.i?.logado && !x.i.protegida);
    const pedras = new Map();
    for (const x of alvos) for (const p of x.i.pedras ?? []) {
      const r = pedras.get(p.nome) ?? { nome: p.nome, total: 0, contas: 0 };
      r.total += p.q; r.contas++;
      pedras.set(p.nome, r);
    }
    const lista = [...pedras.values()].sort((a, b) => a.nome.localeCompare(b.nome));
    if (!reb.nome || !pedras.has(reb.nome)) reb.nome = lista[0]?.nome ?? '';
    const linhaConta = (x) => {
      const nome = x.i?.nick ?? x.c.nome;
      if (!x.i) return `<tr><td>${escH(x.c.nome)}</td><td colspan="4" class="ajuda">carregando / sem o módulo</td></tr>`;
      if (!x.i.logado) return `<tr><td>${escH(x.c.nome)}</td><td colspan="4" class="ajuda">deslogada</td></tr>`;
      if (x.i.protegida) return `<tr><td><b>${escH(nome)}</b></td><td colspan="4" class="ruim">🔒 protegida — nunca anuncia</td></tr>`;
      const pv = reb.previas?.get(x.c.n);
      const res = reb.resultados?.get(x.c.n);
      const tem = (x.i.pedras ?? []).find((p) => p.nome === reb.nome)?.q ?? 0;
      return `<tr><td><b>${escH(nome)}</b></td><td>${tem ? fmtN(tem) : '<span class="ajuda">não tem</span>'}</td>
        <td>${pv ? (pv.erro ? `<span class="ruim">${escH(pv.erro)}</span>` : pv.preco ? `${fmtN(pv.ref)} <span class="ajuda">(${escH(pv.fonte)}, ${fmtN(pv.anuncios)} anúncios)</span>` : '—') : '—'}</td>
        <td>${pv?.preco ? `<b>${fmtN(pv.preco)}</b> <span class="ajuda">−${Math.round(pv.desconto * 1000) / 10}%</span>` : '—'}</td>
        <td>${res ? (res.ok ? `<span class="ok">✅ ${res.qtd}× por ${fmtN(res.preco)}</span>` : `<span class="ruim">${escH(res.msg)}</span>`) : ''}</td></tr>`;
    };
    const prontas = reb.previas ? alvos.filter((x) => reb.previas.get(x.c.n)?.preco) : [];
    host.innerHTML = `
      <header><span>📉 Pedra abaixo do mercado — todas as contas alternativas</span><button data-reb="fechar">×</button></header>
      <section>
        ${lista.length ? `<div class="linha">
          Pedra <select data-reb-c="nome">${lista.map((p) => `<option ${p.nome === reb.nome ? 'selected' : ''}>${escH(p.nome)}</option>`).join('')}</select>
          <span class="ajuda">${(() => { const p = pedras.get(reb.nome); return p ? `${fmtN(p.total)} no total, em ${p.contas} conta(s)` : ''; })()}</span>
        </div>
        <div class="linha">
          Quantidade por conta ${[1, 2].map((n) => `<button data-reb="qtd" data-v="${n}" class="${reb.qtd === n ? 'on' : ''}">${n}</button>`).join('')}
          · desconto <input data-reb-c="desconto" type="number" min="5" max="10" step="0.5" placeholder="auto" value="${escH(reb.desconto)}"> % <span class="ajuda">(vazio = automático entre 5% e 10%)</span>
        </div>
        <div class="linha">
          <button data-reb="previa" ${reb.rodando ? 'disabled' : ''}>🔎 Ver preços em cada conta</button>
          <button data-reb="publicar" class="on" ${reb.rodando || !prontas.length ? 'disabled' : ''}>📢 Publicar em ${prontas.length} conta(s)</button>
          ${reb.rodando ? `<span class="ajuda">${escH(reb.rodando)}</span>` : ''}
        </div>` : '<p class="ajuda">Nenhuma pedra nas contas alternativas logadas.</p>'}
        <p class="ajuda">Em COINS. O preço de cada conta é calculado no "Ver preços", antes de qualquer publicação — assim uma conta não baixa em cima do anúncio da outra.</p>
      </section>
      <section>
        <table><tr><th>Conta</th><th>Tem</th><th>Referência</th><th>Vai anunciar por (cada)</th><th>Resultado</th></tr>
          ${reb.info.map(linhaConta).join('')}</table>
      </section>`;
  }

  async function abrirReb() {
    reb.previas = null; reb.resultados = null;
    document.getElementById('reb-fundo').classList.add('aberto');
    document.getElementById('reb-modal').innerHTML = '<p style="padding:14px">Lendo as contas…</p>';
    await lerContasReb();
    pintarReb();
  }

  async function previaReb() {
    reb.rodando = 'lendo os preços…'; reb.resultados = null; pintarReb();
    reb.previas = new Map();
    const alvos = reb.info.filter((x) => x.i?.logado && !x.i.protegida);
    const arg = JSON.stringify({ nome: reb.nome, desconto: reb.desconto === '' ? null : Number(reb.desconto) });
    await Promise.all(alvos.map(async (x) => {
      reb.previas.set(x.c.n, (await naConta(x.c, `window.__pokeVendas.previaRebaixar(${arg})`)) ?? { erro: 'sem resposta' });
    }));
    reb.rodando = false;
    pintarReb();
  }

  async function publicarReb() {
    const alvos = reb.info.filter((x) => x.i?.logado && !x.i.protegida && reb.previas?.get(x.c.n)?.preco);
    if (!alvos.length) return;
    const linhas = alvos.map((x) => { const pv = reb.previas.get(x.c.n); return `${x.i.nick}: ${Math.min(pv.tem, reb.qtd)}× por ${fmtN(pv.preco)} Coins`; }).join('\n');
    if (!confirm(`Publicar ${reb.nome} em ${alvos.length} conta(s)?\n\n${linhas}\n\nMoeda: COINS. A conta protegida não entra.`)) return;
    reb.resultados = new Map();
    reb.rodando = 'publicando…'; pintarReb();
    for (const x of alvos) {
      const pv = reb.previas.get(x.c.n);
      const arg = JSON.stringify({ nome: reb.nome, qtd: reb.qtd, preco: pv.preco, itemId: pv.itemId, ref: pv.ref, desconto: Math.round(pv.desconto * 100) });
      reb.resultados.set(x.c.n, (await naConta(x.c, `window.__pokeVendas.rebaixarAgora(${arg})`)) ?? { ok: false, msg: 'sem resposta' });
      pintarReb();
    }
    reb.rodando = false;
    await lerContasReb(); // quantidades novas
    pintarReb();
    const ok = [...reb.resultados.values()].filter((r) => r.ok).length;
    aviso(`📉 ${reb.nome}: anunciado em ${ok} de ${alvos.length} conta(s)`);
  }

  document.getElementById('bt-rebaixar').onclick = abrirReb;
  document.getElementById('reb-fundo').addEventListener('click', (e) => {
    if (e.target.id === 'reb-fundo') return e.currentTarget.classList.remove('aberto');
    const b = e.target.closest('[data-reb]');
    if (!b || b.disabled) return;
    const a = b.dataset.reb;
    if (a === 'fechar') document.getElementById('reb-fundo').classList.remove('aberto');
    else if (a === 'qtd') { reb.qtd = Number(b.dataset.v); pintarReb(); }
    else if (a === 'previa') previaReb();
    else if (a === 'publicar') publicarReb();
  });
  document.getElementById('reb-fundo').addEventListener('change', (e) => {
    const c = e.target.dataset.rebC;
    if (!c) return;
    reb[c] = e.target.value;
    reb.previas = null; reb.resultados = null;
    pintarReb();
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') focar(null); });

  // Atualização ao vivo: lógica nova entra nas 4 contas sem recarregar nada.
  window.multi.aoMudarLogica((codigo) => {
    logica = codigo;
    versaoLogica = lerVersao(codigo);
    atualizarInfo();
    for (const c of contas) injetarLogica(c);
    aviso(`🤖 Bot atualizado nas ${contas.length} contas — lógica v${versaoLogica}`);
  });
  window.multi.aoMudarCore(() => {
    for (const c of contas) c.wv.executeJavaScript("window.postMessage({ pokebot: 'core-mudou' }, location.origin)").catch(() => {});
    aviso('🤖 Núcleo do bot atualizado — recarregue cada conta (⟳) quando ela estiver no Centro Pokémon.', 8000);
  });
})();
</script>
