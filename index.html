<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
<title>PokeIdle Multi</title>
<style>
  :root{--fundo:#1d1010;--barra:#3a2020;--borda:#e2915a;--texto:#f6e7d4;--roxo:#b04ad0;--ouro:#f3c77a}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--fundo);color:var(--texto);font:13px system-ui,sans-serif;overflow:hidden}
  #topo{height:38px;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--barra);border-bottom:2px solid var(--borda)}
  #topo b{color:var(--ouro);letter-spacing:.5px;margin-right:8px}
  #topo .esp{flex:1}
  #topo .info{opacity:.75;font-size:12px}
  button{background:#5a3232;border:1px solid #8a5a4a;color:var(--texto);border-radius:6px;padding:4px 9px;cursor:pointer;font:inherit}
  button:hover{background:#6e3d3d}
  button.prim{background:var(--roxo);border-color:var(--ouro);color:#fff}
  #grade{position:absolute;top:38px;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:4px;padding:4px}
  #grade.solo{grid-template-columns:1fr;grid-template-rows:1fr}
  #grade.solo .conta:not(.foco){display:none}
  .conta{position:relative;display:flex;flex-direction:column;border:2px solid #5a3232;border-radius:8px;overflow:hidden;background:#000;min-width:0;min-height:0}
  .conta.foco{border-color:var(--borda)}
  .cab{height:28px;flex:none;display:flex;align-items:center;gap:6px;padding:0 6px;background:var(--barra)}
  .cab .num{background:var(--roxo);color:#fff;border-radius:5px;padding:1px 7px;font-weight:800}
  .cab input.nome{background:transparent;border:1px solid transparent;color:var(--texto);font:600 13px system-ui;width:140px;border-radius:5px;padding:2px 4px}
  .cab input.nome:hover,.cab input.nome:focus{border-color:#8a5a4a;outline:none;background:#2a1515}
  .cab .esp{flex:1}
  .cab .zoom{min-width:38px;text-align:center;opacity:.8;font-size:12px}
  .cab button{padding:1px 7px;font-size:12px}
  .cab button.eco.on{background:#2f6b3a;border-color:#7fdc8f}
  .cab .estado{width:9px;height:9px;border-radius:50%;background:#888}
  .cab .estado.ok{background:#6f6;box-shadow:0 0 5px #6f6}
  .cab .estado.carregando{background:#fc6}
  webview{flex:1;width:100%;min-height:0}
  #aviso{position:fixed;left:50%;top:48px;transform:translateX(-50%);z-index:10;background:#2a1515;border:2px solid var(--ouro);border-radius:10px;padding:8px 14px;font-weight:600;display:none}
</style>
</head>
<body>
<div id="topo">
  <b>🤖 PokeIdle Multi</b>
  <button id="bt-grade" class="prim" title="Mostrar as 4 contas">Grade 2×2</button>
  <span class="esp"></span>
  <span class="info" id="info-bot">bot: carregando…</span>
  <button id="bt-pasta" title="Abre a pasta onde ficam core.js e logica.js">Pasta do bot</button>
</div>
<div id="grade"></div>
<div id="aviso"></div>

<script>
(async () => {
  const cfg = await window.multi.cfg();
  const grade = document.getElementById('grade');
  const contas = [];
  let logica = await window.multi.logica();
  let versaoLogica = '?';
  const salvar = () => window.multi.salvar({ contas: contas.map((c) => ({ nome: c.nome, zoom: c.zoom, mudo: c.mudo })) });

  function aviso(txt, ms = 4000) {
    const el = document.getElementById('aviso');
    el.textContent = txt;
    el.style.display = 'block';
    clearTimeout(aviso.t);
    aviso.t = setTimeout(() => (el.style.display = 'none'), ms);
  }

  function lerVersao(codigo) {
    const m = /VERSAO_LOGICA\s*=\s*'([^']+)'/.exec(codigo);
    return m ? m[1] : '?';
  }
  function atualizarInfo() {
    document.getElementById('info-bot').textContent = `bot: lógica v${versaoLogica} · atualiza sozinho ao salvar a pasta do bot`;
  }
  versaoLogica = lerVersao(logica);
  atualizarInfo();

  // Modo Economia do jogo. Usa os próprios controles dele: ligar = abrir Configurações e clicar
  // no interruptor (o jogo fecha o modal sozinho ao ligar); desligar = o botão "Ligar a cena".
  // O estado é a classe `modo-economia` no <html>, a mesma que o jogo usa.
  const JS_ECO_ESTADO = "document.documentElement.classList.contains('modo-economia')";
  const JS_ECO_ALTERNAR = `(() => {
    const ligado = () => document.documentElement.classList.contains('modo-economia');
    if (ligado()) { document.getElementById('eco-sair')?.click(); return ligado(); }
    document.getElementById('btn-config')?.click();
    const sw = document.getElementById('cfg-economia');
    if (sw) sw.click();
    else document.getElementById('modal-fechar')?.click();
    return ligado();
  })()`;

  async function injetarLogica(c) {
    try { await c.wv.executeJavaScript(logica); }
    catch (e) { console.warn('lógica não entrou na conta', c.n, e); }
  }

  for (let n = 1; n <= cfg.nContas; n++) {
    const salvo = cfg.contas?.[n - 1] ?? {};
    const c = { n, nome: salvo.nome ?? `Conta ${n}`, zoom: salvo.zoom ?? 0.6, mudo: salvo.mudo ?? (n !== 1) };

    const caixa = document.createElement('div');
    caixa.className = 'conta';
    caixa.innerHTML = `
      <div class="cab">
        <span class="num">${n}</span>
        <span class="estado carregando" title="conexão"></span>
        <input class="nome" value="${c.nome.replace(/"/g, '&quot;')}" spellcheck="false" title="Clique para renomear">
        <span class="esp"></span>
        <button data-a="eco" class="eco" title="Ligar/desligar o Modo Economia do jogo nesta conta">🍃 Eco</button>
        ${cfg.rotom ? '<button data-a="rotom" title="Abrir o Cockpit do Rotom Sniper desta conta">🎯 Rotom</button>' : ''}
        <button data-a="menos" title="Diminuir zoom">−</button>
        <span class="zoom"></span>
        <button data-a="mais" title="Aumentar zoom">+</button>
        <button data-a="som" title="Som desta conta"></button>
        <button data-a="foco" title="Expandir / voltar à grade">⛶</button>
        <button data-a="recarregar" title="Recarregar esta conta">⟳</button>
        <button data-a="sair" title="Deslogar esta conta">Sair</button>
      </div>`;
    const wv = document.createElement('webview');
    wv.setAttribute('partition', `persist:conta${n}`);
    wv.setAttribute('src', cfg.urlJogo);
    wv.setAttribute('allowpopups', '');
    wv.setAttribute('webpreferences', 'backgroundThrottling=no');
    caixa.appendChild(wv);
    grade.appendChild(caixa);
    Object.assign(c, { caixa, wv });
    contas.push(c);

    const elZoom = caixa.querySelector('.zoom');
    const elSom = caixa.querySelector('[data-a="som"]');
    const elEstado = caixa.querySelector('.estado');
    const pintar = () => {
      elZoom.textContent = `${Math.round(c.zoom * 100)}%`;
      elSom.textContent = c.mudo ? '🔇' : '🔊';
    };
    const elEco = caixa.querySelector('[data-a="eco"]');
    const pintarEco = (ligado) => {
      elEco.classList.toggle('on', ligado);
      elEco.textContent = ligado ? '🍃 Eco ON' : '🍃 Eco';
    };
    const lerEco = () => wv.executeJavaScript(JS_ECO_ESTADO).then(pintarEco).catch(() => {});
    // O modo também pode ser trocado pelo próprio jogo — o botão acompanha.
    setInterval(lerEco, 3000);
    pintar();

    wv.addEventListener('dom-ready', () => {
      wv.setZoomFactor(c.zoom);
      wv.setAudioMuted(c.mudo);
      injetarLogica(c);
    });
    wv.addEventListener('did-start-loading', () => (elEstado.className = 'estado carregando'));
    wv.addEventListener('did-stop-loading', () => (elEstado.className = 'estado ok'));
    wv.addEventListener('did-fail-load', (e) => { if (e.errorCode !== -3) elEstado.className = 'estado'; });

    caixa.querySelector('.nome').onchange = (e) => { c.nome = e.target.value.trim() || `Conta ${n}`; salvar(); };
    caixa.querySelector('.cab').onclick = (e) => {
      const a = e.target.closest('button')?.dataset.a;
      if (!a) return;
      if (a === 'mais' || a === 'menos') {
        c.zoom = Math.min(1.5, Math.max(0.3, +(c.zoom + (a === 'mais' ? 0.05 : -0.05)).toFixed(2)));
        wv.setZoomFactor(c.zoom); pintar(); salvar();
      } else if (a === 'eco') {
        wv.executeJavaScript(JS_ECO_ALTERNAR).then(pintarEco).catch(() => aviso('Modo Economia: a conta ainda está carregando.'));
      } else if (a === 'rotom') {
        window.multi.abrirCockpit(n);
      } else if (a === 'som') {
        c.mudo = !c.mudo; wv.setAudioMuted(c.mudo); pintar(); salvar();
      } else if (a === 'foco') {
        focar(grade.classList.contains('solo') && caixa.classList.contains('foco') ? null : c);
      } else if (a === 'recarregar') {
        if (confirm(`Recarregar "${c.nome}"?\n\nSe ela estiver no meio de uma luta, o jogo conta como derrota (perde XP). Faça isso no Centro Pokémon.`)) wv.reload();
      } else if (a === 'sair') {
        if (confirm(`Deslogar "${c.nome}"? Os dados de login desta conta neste app serão apagados.`)) {
          window.multi.sairDaConta(n).then(() => wv.loadURL(cfg.urlJogo));
        }
      }
    };
  }

  function focar(c) {
    for (const x of contas) x.caixa.classList.toggle('foco', x === c);
    grade.classList.toggle('solo', !!c);
    if (c) c.wv.setZoomFactor(Math.min(1, c.zoom * 1.6));
    else for (const x of contas) x.wv.setZoomFactor(x.zoom);
  }
  document.getElementById('bt-grade').onclick = () => focar(null);
  document.getElementById('bt-pasta').onclick = () => window.multi.abrirPastaBot();
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') focar(null); });

  // Atualização ao vivo: lógica nova entra nas 4 contas sem recarregar nada.
  window.multi.aoMudarLogica((codigo) => {
    logica = codigo;
    versaoLogica = lerVersao(codigo);
    atualizarInfo();
    for (const c of contas) injetarLogica(c);
    aviso(`🤖 Bot atualizado nas ${contas.length} contas — lógica v${versaoLogica}`);
  });
  window.multi.aoMudarCore(() => {
    for (const c of contas) c.wv.executeJavaScript("window.postMessage({ pokebot: 'core-mudou' }, location.origin)").catch(() => {});
    aviso('🤖 Núcleo do bot atualizado — recarregue cada conta (⟳) quando ela estiver no Centro Pokémon.', 8000);
  });
})();
</script>
</body>
</html>
