# Gera o .dmg do PokeIdle Multi para Mac (Intel + Apple Silicon) numa máquina macOS do GitHub.
# Dispara com uma tag "mac-*" (ex.: git tag mac-1.12.27 && git push origin mac-1.12.27) ou pelo
# botão "Run workflow" na aba Actions. O .dmg sai em "Artifacts" no fim da execução.
name: Build Mac (dmg)
on:
  workflow_dispatch:
  push:
    tags: ['mac-*']
jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: npm run build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -o pipefail
          if ! npm run build:mac 2>&1 | tee build.log; then
            # o fim do log vira uma anotação (dá para ler sem login, pela API do GitHub)
            echo "::error title=build:mac falhou::$(tail -40 build.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: PokeIdle-Multi-Mac
          path: dist/*.dmg
          retention-days: 30
